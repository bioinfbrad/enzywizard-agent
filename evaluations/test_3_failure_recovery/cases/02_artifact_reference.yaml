    fault_injection: {injection_point: argument_resolution, fault_type: stale_output_reference, argument_name: input_path, artifact_type: cleaned_structure_cif, available_compatible_artifacts: 1, occurrence: first_attempt_only, error_message: "Expected exactly one artifact_type cleaned_structure_cif from the referenced step."}
    expected: {diagnostic_category: path_or_file, failure_stage: preparation, recoverability: automatic, decision: retry, action: repair_managed_inputs, repair_type: rebind_output_reference, final_status: succeeded, automatic_recovery_success: true, scientific_change_required: false, user_confirmation_required: false}
    allowed_actions: [repair_managed_inputs, retry_current_step]
    forbidden_actions: [rerun_structure_cleaning, replace_user_input, change_docking_parameters]
    required_trace: [failure_diagnosis, recovery_decision, managed_input_repair, recovery_attempt, final_outcome]
  - case_id: T3-AR03
    description: Stale docked-ligand reference for interaction analysis
    scenario: tool_execution
    tool_name: enzywizard-interaction
    fault_injection: {injection_point: argument_resolution, fault_type: stale_output_reference, argument_name: substrate_dir, artifact_type: docked_substrate_sdf, available_compatible_artifacts: 1, occurrence: first_attempt_only, error_message: "Expected exactly one artifact_type docked_substrate_sdf from the referenced step."}
    expected: {diagnostic_category: path_or_file, failure_stage: preparation, recoverability: automatic, decision: retry, action: repair_managed_inputs, repair_type: rebind_output_reference, final_status: succeeded, automatic_recovery_success: true, scientific_change_required: false, user_confirmation_required: false}
