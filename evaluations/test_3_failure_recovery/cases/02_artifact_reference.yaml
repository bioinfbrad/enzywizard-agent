  - case_id: T3-AR04
    description: Stale registered historical clean artifact after current-plan import
    scenario: tool_execution
    tool_name: enzywizard-disorder
    fault_injection: {injection_point: argument_resolution, fault_type: stale_imported_historical_reference, argument_name: input_path, artifact_type: cleaned_structure_cif, available_compatible_artifacts: 1, occurrence: first_attempt_only, error_message: "Expected exactly one artifact_type cleaned_structure_cif for the imported historical input."}
    expected: {diagnostic_category: path_or_file, failure_stage: preparation, recoverability: automatic, decision: retry, action: repair_managed_inputs, repair_type: rebind_output_reference, final_status: succeeded, automatic_recovery_success: true, scientific_change_required: false, user_confirmation_required: false}
