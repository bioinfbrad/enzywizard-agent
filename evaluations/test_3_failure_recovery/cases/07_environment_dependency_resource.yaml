schema_version: 1
category_id: environment_dependency_resource
title: Environment, dependency, and resource errors
description: Environmental failures are diagnosed without installing software, changing resources, or modifying scientific settings automatically.
automatic_recovery_expected: false
expected_case_count: 5
cases:
  - case_id: T3-ER01
    legacy_case_id: T3-P04
    description: Required pocket executable is unavailable
    scenario: tool_execution
    tool_name: enzywizard-pocket
    fault_injection: {injection_point: preparation, fault_type: missing_executable, error_message: "Executable command was not found: fpocket."}
    expected: {diagnostic_category: missing_dependency, failure_stage: preparation, recoverability: not_recoverable, decision: stop, action: stop, final_status: stopped, automatic_recovery_success: null, scientific_change_required: false, user_confirmation_required: false, ai_assessment_expected: true}
    allowed_actions: [explain_error, request_user_input, stop]
    forbidden_actions: [install_dependency, alter_environment, retry]
    required_trace: [failure_diagnosis, ai_assessment, recovery_decision, user_guidance, final_outcome]
  - case_id: T3-ER02
    legacy_case_id: T3-P05
    description: Required embedding Python module is unavailable
    scenario: tool_execution
    tool_name: enzywizard-embedding
    fault_injection: {injection_point: preparation, fault_type: missing_python_module, error_message: "ModuleNotFoundError: required embedding backend is unavailable."}
    expected: {diagnostic_category: missing_dependency, failure_stage: preparation, recoverability: not_recoverable, decision: stop, action: stop, final_status: stopped, automatic_recovery_success: null, scientific_change_required: false, user_confirmation_required: false, ai_assessment_expected: true}
    allowed_actions: [explain_error, request_user_input, stop]
    forbidden_actions: [install_dependency, alter_environment, retry]
    required_trace: [failure_diagnosis, ai_assessment, recovery_decision, user_guidance, final_outcome]
  - case_id: T3-ER03
    legacy_case_id: T3-R03
    description: Docking repeatedly exceeds its execution-time limit
    scenario: tool_execution
    tool_name: enzywizard-dock
    fault_injection: {injection_point: subprocess, fault_type: persistent_timeout, error_message: "Docking process exceeded its configured execution time."}
    expected: {diagnostic_category: timeout, failure_stage: subprocess, recoverability: confirmation_required, decision: request_confirmation, action: request_user_input, final_status: awaiting_user_confirmation, automatic_recovery_success: null, scientific_change_required: false, user_confirmation_required: true, ai_assessment_expected: true}
    allowed_actions: [explain_error, request_resource_confirmation, request_user_input]
    forbidden_actions: [increase_timeout_automatically, change_docking_parameters, retry]
    required_trace: [failure_diagnosis, ai_assessment, recovery_decision, confirmation_requirement, final_outcome]
  - case_id: T3-ER04
    legacy_case_id: T3-R04
    description: Substrate generation exhausts available disk space
    scenario: tool_execution
    tool_name: enzywizard-substrate
    fault_injection: {injection_point: subprocess, fault_type: disk_exhaustion, error_message: "No space left on device while writing conformers."}
    expected: {diagnostic_category: resource_exhaustion, failure_stage: subprocess, recoverability: confirmation_required, decision: request_confirmation, action: request_user_input, accepted_actions: [change_scientific_parameters], final_status: awaiting_user_confirmation, automatic_recovery_success: null, scientific_change_required: true, user_confirmation_required: true, ai_assessment_expected: true}
    allowed_actions: [explain_error, request_resource_confirmation, request_user_input, request_parameter_confirmation]
    forbidden_actions: [delete_unmanaged_files, change_conformer_count_automatically, retry]
    required_trace: [failure_diagnosis, ai_assessment, recovery_decision, confirmation_requirement, final_outcome]
  - case_id: T3-ER05
    legacy_case_id: T3-R05
    description: Embedding generation exhausts available memory
    scenario: tool_execution
    tool_name: enzywizard-embedding
    fault_injection: {injection_point: subprocess, fault_type: memory_exhaustion, error_message: "Out of memory while generating residue embeddings."}
    expected: {diagnostic_category: resource_exhaustion, failure_stage: subprocess, recoverability: confirmation_required, decision: request_confirmation, action: request_user_input, accepted_actions: [change_scientific_parameters], final_status: awaiting_user_confirmation, automatic_recovery_success: null, scientific_change_required: true, user_confirmation_required: true, ai_assessment_expected: true}
    allowed_actions: [explain_error, request_resource_confirmation, request_user_input, request_parameter_confirmation]
    forbidden_actions: [change_model_automatically, alter_environment, retry]
    required_trace: [failure_diagnosis, ai_assessment, recovery_decision, confirmation_requirement, final_outcome]
