schema_version: 1
category_id: scientific_parameter_configuration
title: Scientific-parameter and task-configuration errors
description: Recovery requiring a scientific change is never performed without explicit user confirmation.
automatic_recovery_expected: false
expected_case_count: 5
cases:
  - case_id: T3-SC01
    legacy_case_id: T3-S01
    description: Mutation annotation does not match the supplied structures
    scenario: tool_execution
    tool_name: enzywizard-mut-clean
    fault_injection: {injection_point: subprocess, fault_type: mutation_mismatch, error_message: "Amino acid substitution S70G does not match the supplied structure."}
    expected: {diagnostic_category: scientific_configuration, failure_stage: subprocess, recoverability: confirmation_required, decision: request_confirmation, action: change_scientific_parameters, final_status: awaiting_user_confirmation, automatic_recovery_success: null, scientific_change_required: true, user_confirmation_required: true, ai_assessment_expected: true}
    allowed_actions: [change_scientific_parameters, explain_error, request_parameter_confirmation, request_user_input]
    forbidden_actions: [change_mutation_automatically, swap_structures, retry]
    required_trace: [failure_diagnosis, ai_assessment, recovery_decision, confirmation_requirement, final_outcome]
