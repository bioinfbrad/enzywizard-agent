schema_version: 2
test_id: test_4_fair_ablation
title: FAIR-aligned terminology metadata ablation

automatic_evaluation:
  factual_unit: Each predeclared report metric identified by report ID, metric name, side, field path, expected value, tolerance, and accepted aliases.
  factual_support: The Agent must emit matching structured metric evidence whose source exists, field path matches, and value is within the fixed tolerance.
  required_fact_policy: Each case receives three to six question-relevant key facts. Single-report cases select up to four prioritized facts, two-report cases select up to three per report, and three-report cases select up to two per report. Paired cases also include the recorded mutation identity.
  evidence_attribution_policy: Precision validates each emitted gold-fact-to-evidence edge; recall validates evidence support for every required gold fact.
  narrative_policy: Free-text integration quality and inference boundaries are evaluated only by the human IIS rubric.

key_fact_metric_priority:
  enzywizard_energy: [total_potential_energy, nonbonded_potential_energy, periodic_torsion_potential_energy]
  enzywizard_flexibility: [residue_root_mean_square_fluctuation_mean, residue_root_mean_square_fluctuation_max, protein_flexibility_count]
  enzywizard_disorder: [disordered_region_count, total_disordered_region_length, max_disordered_region_length]
  enzywizard_aaprops: [amino_acid_residue_properties_count, residue_relative_solvent_accessibility_mean, residue_backbone_phi_angle_mean, residue_backbone_psi_angle_mean]
  enzywizard_hydrocluster: [hydrophobic_cluster_count, max_hydrophobic_cluster_area, total_hydrophobic_cluster_area]
  enzywizard_pocket: [binding_pocket_count, max_binding_pocket_volume, total_binding_pocket_volume]
  enzywizard_conservation: [sequence_conservation_scores_count, hmm_profile_raw_score_mean, normalized_emission_probability_mean, normalized_shannon_information_content_mean]
  enzywizard_embedding: [sequence_embeddings_count, embedding_dimension]
  enzywizard_substrate: [substrates_count, substrate_molecular_weight_mean, substrate_logp_mean, substrate_tpsa_mean]
  enzywizard_dock: [enzyme_substrate_binding_affinity, enzyme_substrate_complex_name, docked_substrate_names]
  enzywizard_interaction: [molecular_interaction_statistics.enzyme_substrate_interaction_statistics.hydrogen_bond_count, molecular_interaction_statistics.enzyme_substrate_interaction_statistics.ionic_bond_count, van_der_waals_contact_count]

report_side_policy:
  paired_case: Assign references containing _wt_ to wt, references containing _mut_ to mut, and mut_clean reports to shared.
  single_case: Assign a sole WT report to single and a sole mutant report to mut.
  mixed_single_case: Assign WT-only multi-report inputs to single.

categories:
  single_report_interpretation: {case_count: 12, enzyme_balanced: true}
  multi_report_integration: {case_count: 12, enzyme_balanced: true}
  multi_report_comparison: {case_count: 12, enzyme_balanced: true}
  multi_turn_follow_up_revision: {case_count: 12, enzyme_balanced: true}
  report_evidence_localization: {case_count: 12, enzyme_balanced: true}

enzymes:
  1MXT:
    name: Streptomyces cholesterol oxidase
    mutation: T244M
    substrate: Cholesterol
  1IU4:
    name: Streptomyces mobaraensis microbial transglutaminase
    mutation: S72N
    substrate: Z-Gln-Gly
  1TCA:
    name: Moesziomyces antarcticus lipase B (CALB)
    mutation: G107A
    substrate: 4-nitrophenyl butyrate

# A report reference is immutable benchmark evidence. Cases assign its semantic side
# (single, wt, mut, or shared) and conversational turn when constructing artifacts.
reports:
  1mxt_wt_energy: {path: ../test_2_result_interpretation/resources/reports/1MXT/wt/energy.json, artifact_type: energy_report_json, source_tool: enzywizard-energy, report_type: enzywizard_energy}
