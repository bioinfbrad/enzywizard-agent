    - {artifact_type: embedding_report_json, side: wt, count: 1}
    - {artifact_type: embedding_report_json, side: mut, count: 1}
  aaprops_single: [{artifact_type: aaprops_report_json, side: single, count: 1}]
  hydrocluster_single: [{artifact_type: hydrocluster_report_json, side: single, count: 1}]
  substrate_single:
    - {artifact_type: substrate_report_json, side: single, count: 1}
    - {artifact_type: substrate_sdf, side: single, count: 1}
  substrate_shared:
    - {artifact_type: substrate_report_json, side: shared, count: 1}
    - {artifact_type: substrate_sdf, side: shared, count: 1}
  dock_single:
