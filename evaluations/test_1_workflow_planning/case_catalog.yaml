schema_version: 2
test_id: test_1_workflow_planning
title: Scientific goal translation and dynamic workflow construction

metrics:
  workflow: [TSA, PCVR, WOVR, RAC, E2E-SR, PPCR]
  boundary: [TSA]

scoring_contract:
  tsa: Compare the actual tool-call multiset with expected_calls, including side.
  pcvr: Validate required arguments and case-level parameter expectations for each expected call.
  wovr: Require every applicable partial-order constraint in order_constraints.
  rac: Resolve required_artifact_groups from this catalog; never derive expected artifacts from the generated plan.
  revision_cases: Score TSA, PCVR, and WOVR on both plans; score RAC and E2E-SR on the final executed plan.
  boundary_cases: Expect an empty tool-call multiset; all metrics except TSA are not applicable.

provenance_profiles:
  standard_workflow:
    - request_to_plan_link
    - tool_selection_reason
    - parameter_value_and_source
    - order_and_dependency_record
    - final_validation_and_approval
  historical_artifact_workflow:
    - request_to_plan_link
    - tool_selection_reason
    - parameter_value_and_source
    - order_and_dependency_record
    - historical_reuse_origin
    - final_validation_and_approval
  historical_plan_workflow:
    - request_to_plan_link
    - tool_selection_reason
    - parameter_value_and_source
    - order_and_dependency_record
    - historical_reuse_origin
    - final_validation_and_approval
  historical_artifact_plan_workflow:
    - request_to_plan_link
    - tool_selection_reason
    - parameter_value_and_source
    - order_and_dependency_record
    - historical_reuse_origin
    - final_validation_and_approval
  revised_workflow:
    - request_to_plan_link
    - tool_selection_reason
    - parameter_value_and_source
    - order_and_dependency_record
    - plan_revision_trace
    - final_validation_and_approval

