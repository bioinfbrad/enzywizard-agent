# RAC covers every required non-log output declared by the corresponding tool.
# Counts refer to required logical artifacts, not the number of conformer files
# inside a logical substrate_sdf artifact set. Runtime logs are evaluated as
# process provenance rather than scientific result artifacts.
artifact_groups:
  single_clean:
    - {artifact_type: cleaned_structure_cif, side: single, count: 1}
    - {artifact_type: cleaned_structure_pdb, side: single, count: 1}
    - {artifact_type: cleaned_sequence_fasta, side: single, count: 1}
    - {artifact_type: clean_report_json, side: single, count: 1}
  paired_clean:
    - {artifact_type: wt_cleaned_structure_cif, side: wt, count: 1}
    - {artifact_type: wt_cleaned_structure_pdb, side: wt, count: 1}
    - {artifact_type: wt_cleaned_sequence_fasta, side: wt, count: 1}
    - {artifact_type: mut_cleaned_structure_cif, side: mut, count: 1}
    - {artifact_type: mut_cleaned_structure_pdb, side: mut, count: 1}
    - {artifact_type: mut_cleaned_sequence_fasta, side: mut, count: 1}
    - {artifact_type: mut_clean_report_json, side: shared, count: 1}
  single_integrate:
    - {artifact_type: integrate_report_json, side: single, count: 1}
    - {artifact_type: integrate_nodes_json, side: single, count: 1}
    - {artifact_type: integrate_edges_json, side: single, count: 1}
  paired_integrate:
    - {artifact_type: mut_integrate_report_json, side: shared, count: 1}
    - {artifact_type: wt_integrate_nodes_json, side: wt, count: 1}
    - {artifact_type: wt_integrate_edges_json, side: wt, count: 1}
    - {artifact_type: mut_integrate_nodes_json, side: mut, count: 1}
    - {artifact_type: mut_integrate_edges_json, side: mut, count: 1}
  batch_single:
    - {artifact_type: integrate_report_json, side: single, count: 1}
    - {artifact_type: integrate_nodes_json, side: single, count: 1}
    - {artifact_type: integrate_edges_json, side: single, count: 1}
  batch_pair:
    - {artifact_type: mut_integrate_report_json, side: shared, count: 1}
    - {artifact_type: wt_integrate_nodes_json, side: wt, count: 1}
    - {artifact_type: wt_integrate_edges_json, side: wt, count: 1}
    - {artifact_type: mut_integrate_nodes_json, side: mut, count: 1}
    - {artifact_type: mut_integrate_edges_json, side: mut, count: 1}
  energy_single: [{artifact_type: energy_report_json, side: single, count: 1}]
  energy_pair:
    - {artifact_type: energy_report_json, side: wt, count: 1}
    - {artifact_type: energy_report_json, side: mut, count: 1}
  flexibility_single: [{artifact_type: flexibility_report_json, side: single, count: 1}]
  flexibility_pair:
    - {artifact_type: flexibility_report_json, side: wt, count: 1}
    - {artifact_type: flexibility_report_json, side: mut, count: 1}
  disorder_single: [{artifact_type: disorder_report_json, side: single, count: 1}]
  disorder_pair:
    - {artifact_type: disorder_report_json, side: wt, count: 1}
    - {artifact_type: disorder_report_json, side: mut, count: 1}
  pocket_single: [{artifact_type: pocket_report_json, side: single, count: 1}]
  pocket_pair:
    - {artifact_type: pocket_report_json, side: wt, count: 1}
    - {artifact_type: pocket_report_json, side: mut, count: 1}
  conservation_single:
    - {artifact_type: cleaned_msa_sto, side: single, count: 1}
    - {artifact_type: hmm_profile, side: single, count: 1}
    - {artifact_type: conservation_report_json, side: single, count: 1}
  conservation_pair:
    - {artifact_type: cleaned_msa_sto, side: wt, count: 1}
    - {artifact_type: hmm_profile, side: wt, count: 1}
    - {artifact_type: conservation_report_json, side: wt, count: 1}
    - {artifact_type: cleaned_msa_sto, side: mut, count: 1}
    - {artifact_type: hmm_profile, side: mut, count: 1}
    - {artifact_type: conservation_report_json, side: mut, count: 1}
  embedding_single: [{artifact_type: embedding_report_json, side: single, count: 1}]
