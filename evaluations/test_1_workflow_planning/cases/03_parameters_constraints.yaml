schema_version: 1
category_id: parameters_constraints
title: Parameters and constraints
description: Explicit parameter values, exclusions, and scope restrictions that must be preserved in the executable plan.
expected_case_count: 12
cases:
  - case_id: T1-PC01
    enzyme_id: 1MXT
    legacy_case_id: T1-W33
    description: Explicit cholesterol oxidase clean parameters
    request: Clean only at pH 6.5 and do not add hydrogens.
    input_profile: 1mxt_single
    fair_relevance: neutral
    expected_plan: clean
    parameter_expectations:
      - {tool: enzywizard-clean, side: single, parameter: pH, accepted_values: [6.5]}
      - {tool: enzywizard-clean, side: single, parameter: add_H, accepted_values: [false]}
    provenance_profile: standard_workflow
  - case_id: T1-PC02
    enzyme_id: 1MXT
    legacy_case_id: T1-W34
    description: Explicit cholesterol oxidase energy parameter
    request: Run energy analysis using 25 minimization iterations.
    input_profile: 1mxt_single
    fair_relevance: neutral
    expected_plan: energy
    parameter_expectations:
      - {tool: enzywizard-energy, side: single, parameter: minimization_iteration, accepted_values: [25]}
    provenance_profile: standard_workflow
  - case_id: T1-PC03
    enzyme_id: 1MXT
    legacy_case_id: T1-W41
