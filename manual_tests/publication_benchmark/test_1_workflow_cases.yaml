schema_version: 1
title: Scientific goal translation and dynamic workflow construction
catalog:
  inputs:
    single: {structure_file: test_inputs/cleaned_3GP6.pdb}
    single_msa: {structure_file: test_inputs/cleaned_3GP6.pdb, msa_file: test_inputs/jhmm_3GP6.sto}
    single_full: {structure_file: test_inputs/cleaned_3GP6.pdb, msa_file: test_inputs/jhmm_3GP6.sto, substrate_name: glucose}
    ligand: {structure_file: test_inputs/cleaned_3GP6.pdb, substrate_name: glucose}
    mutant: {structure_file: test_inputs/1ZG4_WT.pdb, mut_structure_file: test_inputs/1ZG6_S70G.pdb, amino_acid_substitution: S70G}
    mutant_msa: {structure_file: test_inputs/1ZG4_WT.pdb, msa_file: test_inputs/jhmm_1ZG4_WT.sto, mut_structure_file: test_inputs/1ZG6_S70G.pdb, mut_msa_file: test_inputs/jhmm_1ZG6_S70G.sto, amino_acid_substitution: S70G}
    mutant_full: {structure_file: test_inputs/1ZG4_WT.pdb, msa_file: test_inputs/jhmm_1ZG4_WT.sto, mut_structure_file: test_inputs/1ZG6_S70G.pdb, mut_msa_file: test_inputs/jhmm_1ZG6_S70G.sto, substrate_name: glucose, amino_acid_substitution: S70G}
    mutant_ligand: {structure_file: test_inputs/1ZG4_WT.pdb, mut_structure_file: test_inputs/1ZG6_S70G.pdb, substrate_name: glucose, amino_acid_substitution: S70G}
  plans:
    clean: [{name: clean, expected_tools: [enzywizard-clean]}]
    mut_clean: [{name: mut-clean, expected_tools: [enzywizard-mut-clean]}]
    energy: [{name: energy, expected_tools: [enzywizard-clean, enzywizard-energy, enzywizard-integrate], order_constraints: [[enzywizard-clean, enzywizard-energy], [enzywizard-energy, enzywizard-integrate]]}]
    flexibility: [{name: flexibility, expected_tools: [enzywizard-clean, enzywizard-flexibility, enzywizard-integrate], order_constraints: [[enzywizard-clean, enzywizard-flexibility], [enzywizard-flexibility, enzywizard-integrate]]}]
    disorder: [{name: disorder, expected_tools: [enzywizard-clean, enzywizard-disorder, enzywizard-integrate], order_constraints: [[enzywizard-clean, enzywizard-disorder], [enzywizard-disorder, enzywizard-integrate]]}]
    pocket: [{name: pocket, expected_tools: [enzywizard-clean, enzywizard-pocket, enzywizard-integrate], order_constraints: [[enzywizard-clean, enzywizard-pocket], [enzywizard-pocket, enzywizard-integrate]]}]
    conservation: [{name: conservation, expected_tools: [enzywizard-clean, enzywizard-conservation, enzywizard-integrate], order_constraints: [[enzywizard-clean, enzywizard-conservation], [enzywizard-conservation, enzywizard-integrate]]}]
    embedding: [{name: embedding, expected_tools: [enzywizard-clean, enzywizard-embedding, enzywizard-integrate], order_constraints: [[enzywizard-clean, enzywizard-embedding], [enzywizard-embedding, enzywizard-integrate]]}]
    aaprops: [{name: aaprops, expected_tools: [enzywizard-clean, enzywizard-aaprops, enzywizard-integrate], order_constraints: [[enzywizard-clean, enzywizard-aaprops], [enzywizard-aaprops, enzywizard-integrate]]}]
    hydrocluster: [{name: hydrocluster, expected_tools: [enzywizard-clean, enzywizard-hydrocluster, enzywizard-integrate], order_constraints: [[enzywizard-clean, enzywizard-hydrocluster], [enzywizard-hydrocluster, enzywizard-integrate]]}]
    internal: [{name: internal-interaction, expected_tools: [enzywizard-clean, enzywizard-interaction, enzywizard-integrate], forbidden_tools: [enzywizard-substrate, enzywizard-dock], order_constraints: [[enzywizard-clean, enzywizard-interaction], [enzywizard-interaction, enzywizard-integrate]]}]
    energy_flex: [{name: energy-flex, expected_tools: [enzywizard-clean, enzywizard-energy, enzywizard-flexibility, enzywizard-integrate], order_constraints: [[enzywizard-clean, enzywizard-energy], [enzywizard-flexibility, enzywizard-integrate]]}]
    energy_pocket: [{name: energy-pocket, expected_tools: [enzywizard-clean, enzywizard-energy, enzywizard-pocket, enzywizard-integrate]}]
    energy_flex_pocket: [{name: energy-flex-pocket, expected_tools: [enzywizard-clean, enzywizard-energy, enzywizard-flexibility, enzywizard-pocket, enzywizard-integrate]}]
    dynamics: [{name: dynamics, expected_tools: [enzywizard-clean, enzywizard-energy, enzywizard-flexibility, enzywizard-disorder, enzywizard-integrate]}]
    structure_profile: [{name: structure-profile, expected_tools: [enzywizard-clean, enzywizard-aaprops, enzywizard-hydrocluster, enzywizard-pocket, enzywizard-integrate]}]
    sequence_profile: [{name: sequence-profile, expected_tools: [enzywizard-clean, enzywizard-conservation, enzywizard-embedding, enzywizard-integrate]}]
    structure_dynamics: [{name: structure-dynamics, expected_tools: [enzywizard-clean, enzywizard-energy, enzywizard-flexibility, enzywizard-aaprops, enzywizard-hydrocluster, enzywizard-integrate], order_constraints: [[enzywizard-clean, enzywizard-energy], [enzywizard-clean, enzywizard-flexibility], [enzywizard-clean, enzywizard-aaprops], [enzywizard-clean, enzywizard-hydrocluster], [enzywizard-energy, enzywizard-integrate], [enzywizard-flexibility, enzywizard-integrate], [enzywizard-aaprops, enzywizard-integrate], [enzywizard-hydrocluster, enzywizard-integrate]]}]
    energy_conservation: [{name: energy-conservation, expected_tools: [enzywizard-clean, enzywizard-energy, enzywizard-conservation, enzywizard-integrate], order_constraints: [[enzywizard-clean, enzywizard-energy], [enzywizard-clean, enzywizard-conservation], [enzywizard-energy, enzywizard-integrate], [enzywizard-conservation, enzywizard-integrate]]}]
    internal_pocket: [{name: internal-pocket, expected_tools: [enzywizard-clean, enzywizard-pocket, enzywizard-interaction, enzywizard-integrate], forbidden_tools: [enzywizard-substrate, enzywizard-dock], order_constraints: [[enzywizard-clean, enzywizard-pocket], [enzywizard-clean, enzywizard-interaction], [enzywizard-pocket, enzywizard-integrate], [enzywizard-interaction, enzywizard-integrate]]}]
    dock: [{name: dock, expected_tools: [enzywizard-clean, enzywizard-substrate, enzywizard-dock, enzywizard-integrate], forbidden_tools: [enzywizard-interaction], order_constraints: [[enzywizard-substrate, enzywizard-dock]]}]
    dock_interaction: [{name: dock-interaction, expected_tools: [enzywizard-clean, enzywizard-substrate, enzywizard-dock, enzywizard-interaction, enzywizard-integrate], order_constraints: [[enzywizard-substrate, enzywizard-dock], [enzywizard-dock, enzywizard-interaction]]}]
    mut_energy: [{name: mut-energy, expected_tools: [enzywizard-mut-clean, enzywizard-energy, enzywizard-mut-integrate], order_constraints: [[enzywizard-mut-clean, enzywizard-energy], [enzywizard-energy, enzywizard-mut-integrate]]}]
    mut_energy_pocket: [{name: mut-energy-pocket, expected_tools: [enzywizard-mut-clean, enzywizard-energy, enzywizard-pocket, enzywizard-mut-integrate]}]
    mut_dynamics: [{name: mut-dynamics, expected_tools: [enzywizard-mut-clean, enzywizard-energy, enzywizard-flexibility, enzywizard-disorder, enzywizard-mut-integrate]}]
    mut_sequence: [{name: mut-sequence, expected_tools: [enzywizard-mut-clean, enzywizard-conservation, enzywizard-embedding, enzywizard-mut-integrate]}]
    mut_flexibility: [{name: mut-flexibility, expected_tools: [enzywizard-mut-clean, enzywizard-flexibility, enzywizard-mut-integrate], order_constraints: [[enzywizard-mut-clean, enzywizard-flexibility], [enzywizard-flexibility, enzywizard-mut-integrate]]}]
    mut_disorder: [{name: mut-disorder, expected_tools: [enzywizard-mut-clean, enzywizard-disorder, enzywizard-mut-integrate], order_constraints: [[enzywizard-mut-clean, enzywizard-disorder], [enzywizard-disorder, enzywizard-mut-integrate]]}]
    mut_pocket: [{name: mut-pocket, expected_tools: [enzywizard-mut-clean, enzywizard-pocket, enzywizard-mut-integrate], order_constraints: [[enzywizard-mut-clean, enzywizard-pocket], [enzywizard-pocket, enzywizard-mut-integrate]]}]
    mut_dock: [{name: mut-dock, expected_tools: [enzywizard-mut-clean, enzywizard-substrate, enzywizard-dock, enzywizard-mut-integrate], forbidden_tools: [enzywizard-interaction]}]
    mut_dock_interaction: [{name: mut-dock-interaction, expected_tools: [enzywizard-mut-clean, enzywizard-substrate, enzywizard-dock, enzywizard-interaction, enzywizard-mut-integrate]}]
    dock_energy: [{name: dock-energy, expected_tools: [enzywizard-clean, enzywizard-energy, enzywizard-substrate, enzywizard-dock, enzywizard-integrate], forbidden_tools: [enzywizard-interaction], order_constraints: [[enzywizard-clean, enzywizard-energy], [enzywizard-substrate, enzywizard-dock], [enzywizard-energy, enzywizard-integrate], [enzywizard-dock, enzywizard-integrate]]}]
    dock_pocket_interaction: [{name: dock-pocket-interaction, expected_tools: [enzywizard-clean, enzywizard-pocket, enzywizard-substrate, enzywizard-dock, enzywizard-interaction, enzywizard-integrate], order_constraints: [[enzywizard-clean, enzywizard-pocket], [enzywizard-substrate, enzywizard-dock], [enzywizard-dock, enzywizard-interaction], [enzywizard-pocket, enzywizard-integrate], [enzywizard-interaction, enzywizard-integrate]]}]
    mut_dock_energy: [{name: mut-dock-energy, expected_tools: [enzywizard-mut-clean, enzywizard-energy, enzywizard-substrate, enzywizard-dock, enzywizard-mut-integrate], forbidden_tools: [enzywizard-interaction], order_constraints: [[enzywizard-mut-clean, enzywizard-energy], [enzywizard-substrate, enzywizard-dock], [enzywizard-energy, enzywizard-mut-integrate], [enzywizard-dock, enzywizard-mut-integrate]]}]
    flex_disorder: [{name: flex-disorder, expected_tools: [enzywizard-clean, enzywizard-flexibility, enzywizard-disorder, enzywizard-integrate], order_constraints: [[enzywizard-clean, enzywizard-flexibility], [enzywizard-clean, enzywizard-disorder], [enzywizard-flexibility, enzywizard-integrate], [enzywizard-disorder, enzywizard-integrate]]}]
    full_single: [{name: full-single, expected_tools: [enzywizard-clean, enzywizard-batch]}]
    full_mutant: [{name: full-mutant, expected_tools: [enzywizard-mut-clean, enzywizard-mut-batch]}]

cases:
  - {case_id: T1-W01, description: Clean one structure, subtype: workflow, tags: [single, preparation], fair_relevance: neutral, message: "Clean the supplied enzyme structure only.", $input: single, confirmation_actions: [{decision: approved, $plans: clean}], execute_representative: true}
  - {case_id: T1-W02, description: Energy analysis, subtype: workflow, tags: [single, direct], fair_relevance: relevant, message: "Evaluate the energetic state of this enzyme.", $input: single, confirmation_actions: [{decision: approved, $plans: energy}]}
  - {case_id: T1-W03, description: Flexibility analysis, subtype: workflow, tags: [single, direct], fair_relevance: relevant, message: "Analyze collective motions and local flexibility.", $input: single, confirmation_actions: [{decision: approved, $plans: flexibility}]}
  - {case_id: T1-W04, description: Disorder analysis, subtype: workflow, tags: [single, direct], fair_relevance: relevant, message: "Identify intrinsically disordered regions.", $input: single, confirmation_actions: [{decision: approved, $plans: disorder}]}
  - {case_id: T1-W05, description: Pocket analysis, subtype: workflow, tags: [single, direct], fair_relevance: relevant, message: "Identify potential binding pockets.", $input: single, confirmation_actions: [{decision: approved, $plans: pocket}]}
  - {case_id: T1-W06, description: Conservation analysis, subtype: workflow, tags: [single, sequence], fair_relevance: relevant, message: "Assess residue conservation using the alignment.", $input: single_msa, confirmation_actions: [{decision: approved, $plans: conservation}]}
  - {case_id: T1-W07, description: Embedding analysis, subtype: workflow, tags: [single, sequence], fair_relevance: relevant, message: "Generate residue-level protein embeddings.", $input: single, confirmation_actions: [{decision: approved, $plans: embedding}]}
  - {case_id: T1-W08, description: Amino-acid property analysis, subtype: workflow, tags: [single, direct], fair_relevance: relevant, message: "Calculate residue physicochemical properties.", $input: single, confirmation_actions: [{decision: approved, $plans: aaprops}]}
  - {case_id: T1-W09, description: Hydrophobic cluster analysis, subtype: workflow, tags: [single, direct], fair_relevance: relevant, message: "Find connected hydrophobic residue clusters.", $input: single, confirmation_actions: [{decision: approved, $plans: hydrocluster}]}
  - {case_id: T1-W10, description: Internal interactions, subtype: workflow, tags: [single, interaction], fair_relevance: relevant, message: "Analyze internal noncovalent protein interactions without a substrate.", $input: single, confirmation_actions: [{decision: approved, $plans: internal}]}
  - {case_id: T1-W11, description: Energy and flexibility, subtype: workflow, tags: [single, multi-tool], fair_relevance: neutral, message: "Analyze energy and flexibility and integrate both results.", $input: single, confirmation_actions: [{decision: approved, $plans: energy_flex}]}
  - {case_id: T1-W12, description: Energy and pockets, subtype: workflow, tags: [single, multi-tool], fair_relevance: relevant, message: "Assess energy and binding pockets in one integrated analysis.", $input: single, confirmation_actions: [{decision: approved, $plans: energy_pocket}]}
  - {case_id: T1-W13, description: Energy flexibility and pockets, subtype: workflow, tags: [single, multi-tool], fair_relevance: relevant, message: "Analyze energy, flexibility, and binding pockets.", $input: single, confirmation_actions: [{decision: approved, $plans: energy_flex_pocket}]}
  - {case_id: T1-W14, description: Dynamics profile, subtype: workflow, tags: [single, multi-tool], fair_relevance: relevant, message: "Profile energy, flexibility, and disorder and integrate the results.", $input: single, confirmation_actions: [{decision: approved, $plans: dynamics}], execute_representative: true}
  - {case_id: T1-W15, description: Structural profile, subtype: workflow, tags: [single, multi-tool], fair_relevance: relevant, message: "Characterize residue properties, hydrophobic clusters, and binding pockets.", $input: single, confirmation_actions: [{decision: approved, $plans: structure_profile}]}
  - {case_id: T1-W16, description: Sequence profile, subtype: workflow, tags: [single, multi-tool], fair_relevance: relevant, message: "Combine conservation analysis with residue embeddings.", $input: single_msa, confirmation_actions: [{decision: approved, $plans: sequence_profile}]}
  - {case_id: T1-W17, description: Paired structure preparation, subtype: workflow, tags: [mutant, preparation], fair_relevance: relevant, message: "Clean and align wild type and S70G and map the substitution only.", $input: mutant, confirmation_actions: [{decision: approved, $plans: mut_clean}], execute_representative: true}
  - {case_id: T1-W18, description: Paired energy comparison, subtype: workflow, tags: [mutant, direct], fair_relevance: relevant, message: "Compare energy between wild type and S70G.", $input: mutant, confirmation_actions: [{decision: approved, $plans: mut_energy}]}
  - {case_id: T1-W19, description: Paired dynamics comparison, subtype: workflow, tags: [mutant, multi-tool], fair_relevance: relevant, message: "Compare energy, flexibility, and disorder between wild type and S70G.", $input: mutant, confirmation_actions: [{decision: approved, $plans: mut_dynamics}]}
  - {case_id: T1-W20, description: Paired energy and pockets, subtype: workflow, tags: [mutant, multi-tool], fair_relevance: relevant, message: "Compare energetic and binding-pocket features of wild type and S70G.", $input: mutant, confirmation_actions: [{decision: approved, $plans: mut_energy_pocket}]}
  - {case_id: T1-W21, description: Paired sequence profile, subtype: workflow, tags: [mutant, sequence], fair_relevance: relevant, message: "Compare conservation and residue embeddings using both alignments.", $input: mutant_msa, confirmation_actions: [{decision: approved, $plans: mut_sequence}]}
  - {case_id: T1-W22, description: Mutation energy paraphrase, subtype: workflow, tags: [mutant, paraphrase], fair_relevance: neutral, message: "Determine whether S70G changes the computed energy profile.", $input: mutant, confirmation_actions: [{decision: approved, $plans: mut_energy}]}
  - {case_id: T1-W23, description: Mutation dynamics paraphrase, subtype: workflow, tags: [mutant, paraphrase], fair_relevance: relevant, message: "Build a comparative profile of energetic stability, flexibility, and intrinsic disorder.", $input: mutant, confirmation_actions: [{decision: approved, $plans: mut_dynamics}]}
  - {case_id: T1-W24, description: Mutation cavity paraphrase, subtype: workflow, tags: [mutant, paraphrase], fair_relevance: relevant, message: "Evaluate whether S70G changes favorable cavities together with energy.", $input: mutant, confirmation_actions: [{decision: approved, $plans: mut_energy_pocket}]}
  - {case_id: T1-W25, description: Named ligand docking, subtype: workflow, tags: [substrate, docking], fair_relevance: relevant, message: "Prepare glucose and dock it, but do not analyze contacts.", $input: ligand, confirmation_actions: [{decision: approved, $plans: dock}], execute_representative: true}
  - {case_id: T1-W26, description: Docking and interactions, subtype: workflow, tags: [substrate, interaction], fair_relevance: relevant, message: "Prepare glucose, dock it, and analyze enzyme-substrate interactions.", $input: ligand, confirmation_actions: [{decision: approved, $plans: dock_interaction}]}
  - {case_id: T1-W27, description: SMILES docking, subtype: workflow, tags: [substrate, smiles], fair_relevance: relevant, message: "Prepare the supplied SMILES, dock it, and analyze protein-ligand interactions.", inputs: {structure_file: test_inputs/cleaned_3GP6.pdb, substrate_name: CCO}, confirmation_actions: [{decision: approved, $plans: dock_interaction}]}
  - {case_id: T1-W28, description: Paired ligand docking, subtype: workflow, tags: [mutant, substrate], fair_relevance: relevant, message: "Dock glucose to wild type and S70G without contact analysis.", $input: mutant_ligand, confirmation_actions: [{decision: approved, $plans: mut_dock}]}
  - {case_id: T1-W29, description: Paired ligand interactions, subtype: workflow, tags: [mutant, substrate], fair_relevance: relevant, message: "Dock glucose to wild type and S70G and compare their contacts.", $input: mutant_ligand, confirmation_actions: [{decision: approved, $plans: mut_dock_interaction}], execute_representative: true}
  - {case_id: T1-W30, description: Paired SMILES interactions, subtype: workflow, tags: [mutant, smiles], fair_relevance: relevant, message: "Use the SMILES as a shared ligand, dock it to both structures, and compare contacts.", inputs: {structure_file: test_inputs/1ZG4_WT.pdb, mut_structure_file: test_inputs/1ZG6_S70G.pdb, substrate_name: CCO, amino_acid_substitution: S70G}, confirmation_actions: [{decision: approved, $plans: mut_dock_interaction}]}
  - {case_id: T1-W31, description: Complete single analysis, subtype: workflow, tags: [single, complete], fair_relevance: relevant, message: "Run the complete EnzyWizard analysis for this enzyme.", $input: single_full, confirmation_actions: [{decision: approved, $plans: full_single}], execute_representative: true}
  - {case_id: T1-W32, description: Complete paired analysis, subtype: workflow, tags: [mutant, complete], fair_relevance: relevant, message: "Run the complete paired EnzyWizard comparison for wild type and S70G.", $input: mutant_full, confirmation_actions: [{decision: approved, $plans: full_mutant}], execute_representative: true}
  - {case_id: T1-W33, description: Explicit clean parameters, subtype: workflow, tags: [parameters], fair_relevance: neutral, message: "Clean only at pH 6.5 and do not add hydrogens.", $input: single, confirmation_actions: [{decision: approved, acceptable_plans: [{name: clean-parameters, expected_tools: [enzywizard-clean], parameter_expectations: [{tool_name: enzywizard-clean, side: single, parameter_name: pH, accepted_values: [6.5]}, {tool_name: enzywizard-clean, side: single, parameter_name: add_H, accepted_values: [false]}]}]}]}
  - {case_id: T1-W34, description: Explicit energy parameter, subtype: workflow, tags: [parameters], fair_relevance: neutral, message: "Run energy analysis using 25 minimization iterations.", $input: single, confirmation_actions: [{decision: approved, acceptable_plans: [{name: energy-parameters, expected_tools: [enzywizard-clean, enzywizard-energy, enzywizard-integrate], order_constraints: [[enzywizard-clean, enzywizard-energy], [enzywizard-energy, enzywizard-integrate]], parameter_expectations: [{tool_name: enzywizard-energy, side: single, parameter_name: minimization_iteration, accepted_values: [25]}]}]}]}
  - {case_id: T1-W35, description: Replace an analysis, subtype: workflow, tags: [revision], fair_relevance: relevant, message: "Analyze energy and binding pockets.", $input: single, confirmation_actions: [{decision: revision_requested, revision_request: "Replace binding-pocket analysis with flexibility analysis.", $plans: energy_pocket}, {decision: approved, $plans: energy_flex}]}
  - {case_id: T1-W36, description: Extend an analysis, subtype: workflow, tags: [revision], fair_relevance: relevant, message: "Analyze energy and flexibility.", $input: single, confirmation_actions: [{decision: revision_requested, revision_request: "Also add disorder analysis.", $plans: energy_flex}, {decision: approved, $plans: dynamics}]}
  - {case_id: T1-W37, description: Remove downstream analysis, subtype: workflow, tags: [revision, substrate], fair_relevance: relevant, message: "Dock glucose and analyze interactions.", $input: ligand, confirmation_actions: [{decision: revision_requested, revision_request: "Remove interaction analysis and stop after docking and integration.", $plans: dock_interaction}, {decision: approved, $plans: dock}]}
  - {case_id: T1-W38, description: Replace profile, subtype: workflow, tags: [revision], fair_relevance: relevant, message: "Analyze residue properties, hydrophobic clusters, and pockets.", $input: single, confirmation_actions: [{decision: revision_requested, revision_request: "Instead run energy and flexibility only.", $plans: structure_profile}, {decision: approved, $plans: energy_flex}]}
  - {case_id: T1-W39, description: Revise paired comparison, subtype: workflow, tags: [revision, mutant], fair_relevance: relevant, message: "Compare energy between wild type and S70G.", $input: mutant, confirmation_actions: [{decision: revision_requested, revision_request: "Also compare binding pockets.", $plans: mut_energy}, {decision: approved, $plans: mut_energy_pocket}]}
  - {case_id: T1-W40, description: Revise paired docking, subtype: workflow, tags: [revision, mutant], fair_relevance: relevant, message: "Dock glucose to both structures.", $input: mutant_ligand, confirmation_actions: [{decision: revision_requested, revision_request: "Add comparative interaction analysis.", $plans: mut_dock}, {decision: approved, $plans: mut_dock_interaction}]}
  - {case_id: T1-W41, description: Exclude pockets, subtype: workflow, tags: [exclusion], fair_relevance: neutral, message: "Analyze energy and flexibility, but exclude binding-pocket analysis.", $input: single, confirmation_actions: [{decision: approved, acceptable_plans: [{name: no-pocket, expected_tools: [enzywizard-clean, enzywizard-energy, enzywizard-flexibility, enzywizard-integrate], forbidden_tools: [enzywizard-pocket]}]}]}
  - {case_id: T1-W42, description: Exclude interactions, subtype: workflow, tags: [exclusion, substrate], fair_relevance: relevant, message: "Prepare and dock glucose, but explicitly exclude interaction analysis.", $input: ligand, confirmation_actions: [{decision: approved, $plans: dock}]}
  - {case_id: T1-W43, description: Exclude disorder and pockets, subtype: workflow, tags: [exclusion], fair_relevance: neutral, message: "Analyze energy and flexibility only; exclude disorder and pockets.", $input: single, confirmation_actions: [{decision: approved, acceptable_plans: [{name: constrained, expected_tools: [enzywizard-clean, enzywizard-energy, enzywizard-flexibility, enzywizard-integrate], forbidden_tools: [enzywizard-disorder, enzywizard-pocket]}]}]}
  - {case_id: T1-W44, description: Preparation only paired, subtype: workflow, tags: [exclusion, mutant], fair_relevance: neutral, message: "Only clean and align wild type and S70G; run no downstream analyses.", $input: mutant, confirmation_actions: [{decision: approved, $plans: mut_clean}]}
  - {case_id: T1-W45, description: Cavity paraphrase, subtype: workflow, tags: [paraphrase], fair_relevance: relevant, message: "Locate plausible cavities that could accommodate a ligand.", $input: single, confirmation_actions: [{decision: approved, $plans: pocket}]}
  - {case_id: T1-W46, description: Motion paraphrase, subtype: workflow, tags: [paraphrase], fair_relevance: relevant, message: "Estimate collective structural motions and local flexibility.", $input: single, confirmation_actions: [{decision: approved, $plans: flexibility}]}
  - {case_id: T1-W47, description: Evolution paraphrase, subtype: workflow, tags: [paraphrase], fair_relevance: relevant, message: "Find evolutionarily constrained residues from the alignment.", $input: single_msa, confirmation_actions: [{decision: approved, $plans: conservation}]}
  - {case_id: T1-W48, description: Ligand accommodation paraphrase, subtype: workflow, tags: [paraphrase, mutant], fair_relevance: relevant, message: "Compare how the same ligand is accommodated and contacted by wild type and S70G.", $input: mutant_ligand, confirmation_actions: [{decision: approved, $plans: mut_dock_interaction}]}
  - {case_id: T1-W49, description: Structural and dynamic profile, subtype: workflow, tags: [single, multi-tool], fair_relevance: relevant, message: "Combine energetic and flexibility analysis with residue properties and hydrophobic-cluster characterization.", $input: single, confirmation_actions: [{decision: approved, $plans: structure_dynamics}]}
  - {case_id: T1-W50, description: Energy and conservation profile, subtype: workflow, tags: [single, sequence, multi-tool], fair_relevance: relevant, message: "Relate the enzyme's computed energy profile to residue conservation from the supplied alignment.", $input: single_msa, confirmation_actions: [{decision: approved, $plans: energy_conservation}]}
