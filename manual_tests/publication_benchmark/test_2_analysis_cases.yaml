schema_version: 1
title: Multidimensional result integration, interpretation, and provenance
catalog:
  artifacts:
    single_dynamics:
      - {path: ../enzywizard-integrate/examples/input/energy_report_cleaned_3GP6.json, artifact_type: energy_report_json, source_tool: enzywizard-energy, side: single}
      - {path: ../enzywizard-integrate/examples/input/flexibility_report_cleaned_3GP6.json, artifact_type: flexibility_report_json, source_tool: enzywizard-flexibility, side: single}
      - {path: ../enzywizard-integrate/examples/input/disorder_report_cleaned_3GP6.json, artifact_type: disorder_report_json, source_tool: enzywizard-disorder, side: single}
    single_structure:
      - {path: ../enzywizard-integrate/examples/input/aaprops_report_cleaned_3GP6.json, artifact_type: aaprops_report_json, source_tool: enzywizard-aaprops, side: single}
      - {path: ../enzywizard-integrate/examples/input/hydrocluster_report_cleaned_3GP6.json, artifact_type: hydrocluster_report_json, source_tool: enzywizard-hydrocluster, side: single}
      - {path: ../enzywizard-integrate/examples/input/pocket_report_cleaned_3GP6.json, artifact_type: pocket_report_json, source_tool: enzywizard-pocket, side: single}
    single_sequence:
      - {path: ../enzywizard-integrate/examples/input/conservation_report_cleaned_3GP6.json, artifact_type: conservation_report_json, source_tool: enzywizard-conservation, side: single}
      - {path: ../enzywizard-integrate/examples/input/embedding_report_cleaned_3GP6.json, artifact_type: embedding_report_json, source_tool: enzywizard-embedding, side: single}
    single_ligand:
      - {path: ../enzywizard-integrate/examples/input/substrate_report_glucose_fructose.json, artifact_type: substrate_report_json, source_tool: enzywizard-substrate, side: single}
      - {path: ../enzywizard-integrate/examples/input/dock_report_cleaned_3GP6_glucose_fructose.json, artifact_type: dock_report_json, source_tool: enzywizard-dock, side: single}
      - {path: ../enzywizard-integrate/examples/input/interaction_report_cleaned_3GP6_docked_glucose_docked_fructose.json, artifact_type: interaction_report_json, source_tool: enzywizard-interaction, side: single}
    single_integrated:
      - {path: ../enzywizard-integrate/examples/input/energy_report_cleaned_3GP6.json, artifact_type: energy_report_json, source_tool: enzywizard-energy, side: single}
      - {path: ../enzywizard-integrate/examples/input/flexibility_report_cleaned_3GP6.json, artifact_type: flexibility_report_json, source_tool: enzywizard-flexibility, side: single}
      - {path: ../enzywizard-integrate/examples/input/pocket_report_cleaned_3GP6.json, artifact_type: pocket_report_json, source_tool: enzywizard-pocket, side: single}
      - {path: ../enzywizard-integrate/examples/output/integrate_report_3GP6.json, artifact_type: integrate_report_json, source_tool: enzywizard-integrate, side: single}
    paired_dynamics:
      - {path: ../enzywizard-mut-integrate/examples/wt_input/energy_report_cleaned_1ZG4_WT.json, artifact_type: energy_report_json, source_tool: enzywizard-energy, side: wt}
      - {path: ../enzywizard-mut-integrate/examples/mut_input/energy_report_cleaned_1ZG6_S70G.json, artifact_type: energy_report_json, source_tool: enzywizard-energy, side: mut}
      - {path: ../enzywizard-mut-integrate/examples/wt_input/flexibility_report_cleaned_1ZG4_WT.json, artifact_type: flexibility_report_json, source_tool: enzywizard-flexibility, side: wt}
      - {path: ../enzywizard-mut-integrate/examples/mut_input/flexibility_report_cleaned_1ZG6_S70G.json, artifact_type: flexibility_report_json, source_tool: enzywizard-flexibility, side: mut}
    paired_structure:
      - {path: ../enzywizard-mut-integrate/examples/wt_input/aaprops_report_cleaned_1ZG4_WT.json, artifact_type: aaprops_report_json, source_tool: enzywizard-aaprops, side: wt}
      - {path: ../enzywizard-mut-integrate/examples/mut_input/aaprops_report_cleaned_1ZG6_S70G.json, artifact_type: aaprops_report_json, source_tool: enzywizard-aaprops, side: mut}
      - {path: ../enzywizard-mut-integrate/examples/wt_input/pocket_report_cleaned_1ZG4_WT.json, artifact_type: pocket_report_json, source_tool: enzywizard-pocket, side: wt}
      - {path: ../enzywizard-mut-integrate/examples/mut_input/pocket_report_cleaned_1ZG6_S70G.json, artifact_type: pocket_report_json, source_tool: enzywizard-pocket, side: mut}
    paired_ligand:
      - {path: ../enzywizard-mut-integrate/examples/wt_input/dock_report_cleaned_1ZG4_WT_glucose_fructose.json, artifact_type: dock_report_json, source_tool: enzywizard-dock, side: wt}
      - {path: ../enzywizard-mut-integrate/examples/mut_input/dock_report_cleaned_1ZG6_S70G_glucose_fructose.json, artifact_type: dock_report_json, source_tool: enzywizard-dock, side: mut}
      - {path: ../enzywizard-mut-integrate/examples/wt_input/interaction_report_cleaned_1ZG4_WT_docked_glucose_docked_fructose.json, artifact_type: interaction_report_json, source_tool: enzywizard-interaction, side: wt}
      - {path: ../enzywizard-mut-integrate/examples/mut_input/interaction_report_cleaned_1ZG6_S70G_docked_glucose_docked_fructose.json, artifact_type: interaction_report_json, source_tool: enzywizard-interaction, side: mut}
    paired_integrated:
      - {path: ../enzywizard-mut-integrate/examples/wt_input/mut_clean_report_1ZG4_WT_to_1ZG6_S70G.json, artifact_type: mut_clean_report_json, source_tool: enzywizard-mut-clean, side: shared}
      - {path: ../enzywizard-mut-integrate/examples/wt_input/energy_report_cleaned_1ZG4_WT.json, artifact_type: energy_report_json, source_tool: enzywizard-energy, side: wt}
      - {path: ../enzywizard-mut-integrate/examples/mut_input/energy_report_cleaned_1ZG6_S70G.json, artifact_type: energy_report_json, source_tool: enzywizard-energy, side: mut}
      - {path: ../enzywizard-mut-integrate/examples/mut_output/mut_integrate_report_1ZG4_WT_to_1ZG6_S70G.json, artifact_type: mut_integrate_report_json, source_tool: enzywizard-mut-integrate, side: shared}

cases:
  - {case_id: T2-S01, description: Single-enzyme dynamics summary, subtype: single, tags: [single, supporting], fair_relevance: relevant, question: "Summarize the enzyme's energy, flexibility, and disorder results and explain how they complement one another.", $artifacts: single_dynamics, required_report_types: [enzywizard_energy, enzywizard_flexibility, enzywizard_disorder], required_facts: [report each dimension separately, distinguish direct results from interpretation], allowed_conclusions: [the reports provide complementary energetic and dynamic descriptions], forbidden_claims: [experimental activity was proven], required_limitations: [computational outputs are not experimental validation]}
  - {case_id: T2-S02, description: Single-enzyme structural summary, subtype: single, tags: [single, supporting], fair_relevance: relevant, question: "Integrate residue properties, hydrophobic clusters, and pocket results into a structural summary.", $artifacts: single_structure, required_report_types: [enzywizard_aaprops, enzywizard_hydrocluster, enzywizard_pocket], required_facts: [identify evidence from all three reports, link conclusions to report evidence], allowed_conclusions: [the reports characterize complementary structural features], forbidden_claims: [a pocket is experimentally validated], required_limitations: [predicted pockets require validation]}
  - {case_id: T2-S03, description: Sequence evidence summary, subtype: single, tags: [single, sequence], fair_relevance: relevant, question: "Explain what conservation and embedding reports jointly say about residue-level sequence representation.", $artifacts: single_sequence, required_report_types: [enzywizard_conservation, enzywizard_embedding], required_facts: [separate conservation evidence from embedding evidence], allowed_conclusions: [the two reports offer complementary residue-level representations], forbidden_claims: [embeddings directly prove function], required_limitations: [embedding features need downstream interpretation]}
  - {case_id: T2-S04, description: Ligand workflow summary, subtype: enzyme_substrate, tags: [single, ligand], fair_relevance: relevant, question: "Integrate substrate preparation, docking, and interaction results for the enzyme-ligand analysis.", $artifacts: single_ligand, required_report_types: [enzywizard_substrate, enzywizard_dock, enzywizard_interaction], required_facts: [distinguish the substrate preparation summary docking results and interaction results, cite each source], allowed_conclusions: [docking and contact reports describe modeled binding], forbidden_claims: [binding affinity or catalysis was experimentally proven], required_limitations: [docking and interactions are computational predictions]}
  - {case_id: T2-S05, description: Integrated single report cross-check, subtype: supporting, tags: [single, integrated], fair_relevance: neutral, question: "Cross-check the integrated report against its energy, flexibility, and pocket source reports.", $artifacts: single_integrated, required_report_types: [enzywizard_energy, enzywizard_flexibility, enzywizard_pocket, enzywizard_integrate], required_facts: [identify source and integrated reports, preserve source attribution], allowed_conclusions: [the integrated report organizes source results], forbidden_claims: [integration creates new experimental evidence]}
  - {case_id: T2-S06, description: Dynamics evidence trace, subtype: supporting, tags: [single, provenance], fair_relevance: relevant, question: "State the main dynamics observations and identify the report supporting each statement.", $artifacts: single_dynamics, required_report_types: [enzywizard_energy, enzywizard_flexibility, enzywizard_disorder], required_facts: [every main observation has a source], allowed_conclusions: [evidence-linked synthesis is possible], forbidden_claims: [unsupported residue mechanism]}
  - {case_id: T2-S07, description: Structural limitations, subtype: incomplete, tags: [single, limitations], fair_relevance: relevant, question: "What can and cannot be concluded from the available structural feature reports?", $artifacts: single_structure, required_report_types: [enzywizard_aaprops, enzywizard_hydrocluster, enzywizard_pocket], required_facts: [describe available evidence, state missing experimental validation], allowed_conclusions: [structural hypotheses can be prioritized], forbidden_claims: [definitive ligand specificity], required_limitations: [no docking interaction or experimental evidence is supplied]}
  - {case_id: T2-S08, description: Historical single comparison, subtype: historical, tags: [single, historical], fair_relevance: neutral, question: "Treat these as historical reports and summarize the prior dynamics evidence without implying recomputation.", $artifacts: single_dynamics, required_report_types: [enzywizard_energy, enzywizard_flexibility, enzywizard_disorder], required_facts: [identify evidence as historical, avoid claiming a new calculation], allowed_conclusions: [historical reports can be summarized], forbidden_claims: [the tools were rerun]}
  - {case_id: T2-M01, description: WT mutant dynamics comparison, subtype: wt_mut, tags: [mutant, supporting], fair_relevance: relevant, question: "Compare wild-type and S70G energy and flexibility, preserving side-specific evidence.", $artifacts: paired_dynamics, required_report_types: [enzywizard_energy, enzywizard_flexibility], required_facts: [compare WT and MUT separately, cite side-specific reports], allowed_conclusions: [computed differences can be described], forbidden_claims: [the mutation improves activity], required_limitations: [computed differences do not prove phenotype]}
  - {case_id: T2-M02, description: WT mutant structural comparison, subtype: wt_mut, tags: [mutant, structure], fair_relevance: relevant, question: "Compare residue properties and pocket predictions between wild type and S70G.", $artifacts: paired_structure, required_report_types: [enzywizard_aaprops, enzywizard_pocket], required_facts: [preserve WT and MUT identities, use both report types], allowed_conclusions: [predicted structural differences can motivate hypotheses], forbidden_claims: [changed catalytic efficiency was proven]}
  - {case_id: T2-M03, description: WT mutant ligand comparison, subtype: wt_mut, tags: [mutant, ligand], fair_relevance: relevant, question: "Compare modeled docking and interaction evidence for wild type and S70G.", $artifacts: paired_ligand, required_report_types: [enzywizard_dock, enzywizard_interaction], required_facts: [compare both sides and both evidence types], allowed_conclusions: [modeled binding patterns can differ], forbidden_claims: [experimental affinity changed], required_limitations: [docking is not an experimental affinity measurement]}
  - {case_id: T2-M04, description: Integrated WT mutant result, subtype: wt_mut, tags: [mutant, integrated], fair_relevance: relevant, question: "Explain the paired integrated result and trace it to mutation mapping and energy evidence.", $artifacts: paired_integrated, required_report_types: [enzywizard_mut_clean, enzywizard_energy, enzywizard_mut_integrate], required_facts: [identify mutation mapping, preserve WT and MUT energy sources, cite integrated evidence], allowed_conclusions: [the integrated report organizes paired evidence], forbidden_claims: [integration proves causality]}
  - {case_id: T2-M05, description: Side attribution stress test, subtype: wt_mut, tags: [mutant, provenance], fair_relevance: neutral, question: "Report only side-attributed WT versus MUT observations; do not merge their values.", $artifacts: paired_dynamics, required_report_types: [enzywizard_energy, enzywizard_flexibility], required_facts: [no WT MUT attribution swap], allowed_conclusions: [side-specific differences may be reported], forbidden_claims: [unattributed pooled value]}
  - {case_id: T2-M06, description: Mutation mechanism boundary, subtype: wt_mut, tags: [mutant, limitations], fair_relevance: relevant, question: "Summarize structural differences while clearly separating evidence from a possible mutation mechanism.", $artifacts: paired_structure, required_report_types: [enzywizard_aaprops, enzywizard_pocket], required_facts: [label mechanism as hypothesis if mentioned], allowed_conclusions: [differences may support a testable hypothesis], forbidden_claims: [mechanism established], required_limitations: [causality is not established]}
  - {case_id: T2-M07, description: Ligand evidence agreement, subtype: supporting, tags: [mutant, ligand], fair_relevance: relevant, question: "Assess whether docking and interaction evidence support or merely complement each other across both variants.", $artifacts: paired_ligand, required_report_types: [enzywizard_dock, enzywizard_interaction], required_facts: [distinguish docking scores or poses from contacts, discuss both sides], allowed_conclusions: [evidence may support or complement], forbidden_claims: [agreement proves catalysis]}
  - {case_id: T2-M08, description: Historical paired result, subtype: historical, tags: [mutant, historical], fair_relevance: neutral, question: "Summarize this historical WT/MUT evidence and retain its original provenance.", $artifacts: paired_integrated, required_report_types: [enzywizard_mut_clean, enzywizard_energy, enzywizard_mut_integrate], required_facts: [identify historical status and sources], allowed_conclusions: [historical paired evidence can be reused], forbidden_claims: [new computation was performed]}
  - {case_id: T2-L01, description: Glucose-focused ligand interpretation, subtype: enzyme_substrate, tags: [ligand, focused], fair_relevance: relevant, question: "Focus on glucose and explain the modeled preparation, docking, and interaction evidence.", $artifacts: single_ligand, required_report_types: [enzywizard_substrate, enzywizard_dock, enzywizard_interaction], required_facts: [maintain ligand identity, cite docking and interactions], allowed_conclusions: [modeled glucose binding can be described], forbidden_claims: [measured binding constant]}
  - {case_id: T2-L02, description: Ligand provenance audit, subtype: supporting, tags: [ligand, provenance], fair_relevance: relevant, question: "Audit the provenance chain from prepared substrate through docking to interaction analysis.", $artifacts: single_ligand, required_report_types: [enzywizard_substrate, enzywizard_dock, enzywizard_interaction], required_facts: [describe the ordered evidence chain, preserve source tools], allowed_conclusions: [the chain is traceable], forbidden_claims: [missing steps were executed]}
  - {case_id: T2-L03, description: Paired ligand limitation analysis, subtype: incomplete, tags: [mutant, ligand, limitations], fair_relevance: relevant, question: "Compare the available modeled ligand evidence and state what experimental conclusions remain unsupported.", $artifacts: paired_ligand, required_report_types: [enzywizard_dock, enzywizard_interaction], required_facts: [compare both variants, state experimental limitation], allowed_conclusions: [computational differences are hypotheses], forbidden_claims: [experimental superiority], required_limitations: [no experimental validation]}
  - {case_id: T2-L04, description: Paired ligand evidence trace, subtype: supporting, tags: [mutant, ligand, provenance], fair_relevance: relevant, question: "For each comparative ligand conclusion, identify the WT and MUT evidence sources.", $artifacts: paired_ligand, required_report_types: [enzywizard_dock, enzywizard_interaction], required_facts: [two-sided evidence attribution], allowed_conclusions: [comparisons require both sides], forbidden_claims: [one-sided evidence supports a paired conclusion]}
  - {case_id: T2-X01, description: Missing interaction evidence, subtype: incomplete, tags: [incomplete], fair_relevance: relevant, question: "Interpret the ligand workflow but explicitly account for the absence of interaction evidence.", artifacts: [{path: ../enzywizard-integrate/examples/input/substrate_report_glucose_fructose.json, artifact_type: substrate_report_json, source_tool: enzywizard-substrate, side: single}, {path: ../enzywizard-integrate/examples/input/dock_report_cleaned_3GP6_glucose_fructose.json, artifact_type: dock_report_json, source_tool: enzywizard-dock, side: single}], required_report_types: [enzywizard_substrate, enzywizard_dock], required_facts: [state that interaction evidence is absent], allowed_conclusions: [docking evidence alone can be summarized], forbidden_claims: [specific contacts were observed], required_limitations: [interaction report unavailable]}
  - {case_id: T2-X02, description: Missing pocket evidence, subtype: incomplete, tags: [incomplete], fair_relevance: neutral, question: "Summarize energy and flexibility without making pocket claims.", artifacts: [{path: ../enzywizard-integrate/examples/input/energy_report_cleaned_3GP6.json, artifact_type: energy_report_json, source_tool: enzywizard-energy, side: single}, {path: ../enzywizard-integrate/examples/input/flexibility_report_cleaned_3GP6.json, artifact_type: flexibility_report_json, source_tool: enzywizard-flexibility, side: single}], required_report_types: [enzywizard_energy, enzywizard_flexibility], required_facts: [limit the answer to supplied dimensions], allowed_conclusions: [energy and flexibility can be integrated], forbidden_claims: [binding pocket properties], required_limitations: [no pocket report supplied]}
  - {case_id: T2-X03, description: Cross-report caution, subtype: conflicting, tags: [caution], fair_relevance: relevant, question: "Integrate the evidence conservatively and identify any limitations or tensions among report dimensions.", $artifacts: single_integrated, required_report_types: [enzywizard_energy, enzywizard_flexibility, enzywizard_pocket, enzywizard_integrate], required_facts: [do not force all dimensions into one causal conclusion], allowed_conclusions: [different dimensions may be complementary or inconclusive], forbidden_claims: [all reports prove one mechanism], required_limitations: [cross-report association is not causation]}
  - {case_id: T2-X04, description: Minimal evidence boundary, subtype: incomplete, tags: [incomplete, boundary], fair_relevance: neutral, question: "Explain exactly what can be concluded from this energy report and no more.", artifacts: [{path: ../enzywizard-integrate/examples/input/energy_report_cleaned_3GP6.json, artifact_type: energy_report_json, source_tool: enzywizard-energy, side: single}], required_report_types: [enzywizard_energy], required_facts: [state direct energy observations only], allowed_conclusions: [computed energy can be reported], forbidden_claims: [flexibility pockets interactions activity], required_limitations: [only one computational dimension is available]}
  - {case_id: T2-S09, description: Energy-flexibility relationship, subtype: single, tags: [single, integration], fair_relevance: relevant, question: "Relate the available energy and flexibility observations without treating their association as a causal mechanism.", $artifacts: single_dynamics, required_report_types: [enzywizard_energy, enzywizard_flexibility, enzywizard_disorder], required_facts: [identify energy and flexibility as separate computed dimensions, distinguish observations from causal interpretation], allowed_conclusions: [the dimensions can be compared as complementary evidence], forbidden_claims: [energy causes the observed flexibility], required_limitations: [cross-report association is not causation]}
  - {case_id: T2-S10, description: Pocket-centered structural synthesis, subtype: single, tags: [single, pocket], fair_relevance: relevant, question: "Explain how residue properties and hydrophobic clusters provide context for the predicted pockets.", $artifacts: single_structure, required_report_types: [enzywizard_aaprops, enzywizard_hydrocluster, enzywizard_pocket], required_facts: [use all three structural evidence sources, preserve the predicted status of pockets], allowed_conclusions: [structural features can contextualize pocket predictions], forbidden_claims: [the reports establish substrate specificity], required_limitations: [pocket predictions require orthogonal validation]}
  - {case_id: T2-S11, description: Sequence representation boundary, subtype: single, tags: [single, sequence, limitations], fair_relevance: relevant, question: "Summarize conservation and embedding evidence and state which functional conclusions are not supported by these reports alone.", $artifacts: single_sequence, required_report_types: [enzywizard_conservation, enzywizard_embedding], required_facts: [describe both evidence types, state that direct functional validation is absent], allowed_conclusions: [residue-level patterns can prioritize further analysis], forbidden_claims: [specific catalytic function is proven], required_limitations: [functional assignments need additional evidence]}
  - {case_id: T2-M09, description: Paired energy provenance audit, subtype: wt_mut, tags: [mutant, provenance], fair_relevance: relevant, question: "Compare the paired energy results and explicitly identify which evidence belongs to wild type and which belongs to S70G.", $artifacts: paired_dynamics, required_report_types: [enzywizard_energy, enzywizard_flexibility], required_facts: [preserve WT and MUT energy attribution, avoid swapping side-specific observations], allowed_conclusions: [side-specific computed differences may be reported], forbidden_claims: [unattributed pooled values, experimental phenotype was established], required_limitations: [computed differences do not prove phenotype]}
  - {case_id: T2-M10, description: Mutation mapping and energy boundary, subtype: wt_mut, tags: [mutant, integrated, limitations], fair_relevance: relevant, question: "Use the mutation mapping and paired energy evidence to describe differences while avoiding a causal claim.", $artifacts: paired_integrated, required_report_types: [enzywizard_mut_clean, enzywizard_energy, enzywizard_mut_integrate], required_facts: [identify the mapped substitution, preserve both energy sources, separate difference from causality], allowed_conclusions: [the mutation mapping anchors a paired comparison], forbidden_claims: [the substitution caused an activity change], required_limitations: [causality and activity are not established]}
  - {case_id: T2-L05, description: Docking-only interpretation boundary, subtype: enzyme_substrate, tags: [ligand, incomplete], fair_relevance: relevant, question: "Interpret the prepared substrates and docking results while making clear that contact analysis is unavailable.", artifacts: [{path: ../enzywizard-integrate/examples/input/substrate_report_glucose_fructose.json, artifact_type: substrate_report_json, source_tool: enzywizard-substrate, side: single}, {path: ../enzywizard-integrate/examples/input/dock_report_cleaned_3GP6_glucose_fructose.json, artifact_type: dock_report_json, source_tool: enzywizard-dock, side: single}], required_report_types: [enzywizard_substrate, enzywizard_dock], required_facts: [distinguish preparation from docking, state that interaction evidence is unavailable], allowed_conclusions: [modeled docking can be summarized], forbidden_claims: [specific contacts were observed], required_limitations: [no interaction report is supplied]}
  - {case_id: T2-L06, description: Two-ligand identity preservation, subtype: enzyme_substrate, tags: [ligand, attribution], fair_relevance: relevant, question: "Compare the modeled ligand results while keeping glucose and fructose observations separately attributable.", $artifacts: single_ligand, required_report_types: [enzywizard_substrate, enzywizard_dock, enzywizard_interaction], required_facts: [preserve glucose and fructose identities, distinguish docking from interaction evidence], allowed_conclusions: [modeled ligand-specific patterns can be compared], forbidden_claims: [ligand identities can be merged, experimental preference was proven], required_limitations: [computational comparison is not an affinity measurement]}
  - {case_id: T2-L07, description: Ligand evidence chain synthesis, subtype: enzyme_substrate, tags: [ligand, provenance], fair_relevance: relevant, question: "Build a concise evidence chain from substrate preparation through docking to reported contacts, citing each stage.", $artifacts: single_ligand, required_report_types: [enzywizard_substrate, enzywizard_dock, enzywizard_interaction], required_facts: [preserve the preparation docking interaction sequence, attribute each stage to its report], allowed_conclusions: [the modeled workflow is traceable across reports], forbidden_claims: [an unreported workflow stage was completed]}
  - {case_id: T2-L08, description: Paired ligand side and evidence attribution, subtype: enzyme_substrate, tags: [mutant, ligand, provenance], fair_relevance: relevant, question: "Compare modeled ligand behavior across wild type and S70G with separate attribution for docking and contact evidence.", $artifacts: paired_ligand, required_report_types: [enzywizard_dock, enzywizard_interaction], required_facts: [preserve both variant identities, separate docking evidence from interaction evidence], allowed_conclusions: [variant-specific modeled patterns can be compared], forbidden_claims: [experimental binding superiority], required_limitations: [modeled evidence does not establish affinity or catalysis]}
  - {case_id: T2-P01, description: Complementary dynamics evidence, subtype: supporting, tags: [supporting, dynamics], fair_relevance: relevant, question: "Identify where energy, flexibility, and disorder evidence provide complementary rather than redundant information.", $artifacts: single_dynamics, required_report_types: [enzywizard_energy, enzywizard_flexibility, enzywizard_disorder], required_facts: [describe the distinct scope of each report, avoid treating different metrics as interchangeable], allowed_conclusions: [the reports provide complementary characterization], forbidden_claims: [all metrics measure the same property]}
  - {case_id: T2-P02, description: Integrated report source attribution, subtype: supporting, tags: [supporting, integrated, provenance], fair_relevance: relevant, question: "Explain which observations originate in source reports and which are organizational summaries in the integrated report.", $artifacts: single_integrated, required_report_types: [enzywizard_energy, enzywizard_flexibility, enzywizard_pocket, enzywizard_integrate], required_facts: [distinguish source evidence from integrated organization, retain report-level attribution], allowed_conclusions: [integration organizes but does not replace source evidence], forbidden_claims: [the integrated report is an independent experiment]}
  - {case_id: T2-P03, description: Paired structural evidence complementarity, subtype: supporting, tags: [supporting, mutant, structure], fair_relevance: relevant, question: "Assess how residue-property and pocket reports complement one another in the WT/S70G comparison.", $artifacts: paired_structure, required_report_types: [enzywizard_aaprops, enzywizard_pocket], required_facts: [use both report types for both variants, distinguish residue properties from pocket predictions], allowed_conclusions: [the reports support complementary structural hypotheses], forbidden_claims: [complementarity proves a mutation mechanism], required_limitations: [mechanistic causality is not established]}
