schema_version: 2
test_id: test_2_result_interpretation
title: "Scientific Result Interpretation and Evidence Traceability Evaluation"

key_fact_policy_version: question_scope_v6
case_key_fact_overrides:
  T2-SR-01:
    fact_ids: []
    requirements:
      - id: flexibility_finding
        report_ids: [1mxt_wt_flexibility]
        acceptance: "Summarize a main reported RMSF result, such as its mean, maximum, range, or a supported flexible-region observation."
        evidence: "Cite the report or matching field for the result actually summarized."
  T2-SR-02:
    fact_ids: []
    requirements:
      - id: predicted_pocket
        report_ids: [1mxt_wt_pocket]
        acceptance: "Describe at least one major predicted-pocket finding, such as the number, size, or location of a prominent pocket. Keep it framed as a prediction."
        evidence: "Cite the report or matching field for the result actually summarized."
  T2-SR-03:
    fact_ids: []
    requirements:
      - id: mutant_disorder
        report_ids: [1mxt_mut_disorder]
        acceptance: "Summarize a meaningful reported disorder prediction for T244M, such as the number, extent, or locations of its predicted disordered regions."
        evidence: "Cite the report or matching field for the result actually summarized."
  T2-SR-04:
    fact_ids: []
    requirements:
      - id: residue_properties
        report_ids: [1mxt_wt_aaprops]
        acceptance: "Explain a substantive residue-property result, such as solvent accessibility or a supported backbone-angle observation. A record count alone is insufficient."
        evidence: "Cite the report or matching field for the result actually summarized."
  T2-SR-05:
    fact_ids: []
    requirements:
      - id: energy_finding
        report_ids: [1iu4_wt_energy]
        acceptance: "Summarize a main computed energy result, such as the total potential energy or a correctly explained material contribution from the energy terms."
        evidence: "Cite the report or matching field for the result actually summarized."
  T2-SR-06:
    fact_ids: []
    requirements:
      - id: hydrophobic_clusters
        report_ids: [1iu4_wt_hydrocluster]
        acceptance: "Explain at least one substantial reported hydrophobic-cluster result, such as cluster count, area, or a supported prominent cluster description."
        evidence: "Cite the report or matching field for the result actually summarized."
  T2-SR-07:
    fact_ids: []
    requirements:
      - id: mutant_conservation
        report_ids: [1iu4_mut_conservation]
        acceptance: "Describe a supported conservation pattern or score for S72N, including a correctly identified score statistic or residue-level observation. Record count alone is insufficient."
        evidence: "Cite the report or matching field for the result actually summarized."
  T2-SR-08:
    fact_ids: []
    requirements:
      - id: substrate_preparation
        report_ids: [1iu4_wt_substrate]
        acceptance: "Describe a supported detail of the prepared substrate, such as its reported identity, number of entries, or a reported molecular property."
        evidence: "Cite the report or matching field for the result actually summarized."
  T2-SR-09:
    fact_ids: []
    requirements:
      - id: flexibility_finding
        report_ids: [1tca_wt_flexibility]
        acceptance: "Summarize a main CALB flexibility result, such as a reported RMSF statistic or supported flexible-region observation."
        evidence: "Cite the report or matching field for the result actually summarized."
  T2-SR-10:
    fact_ids: []
    requirements:
      - id: predicted_pocket
        report_ids: [1tca_wt_pocket]
        acceptance: "Explain at least one prominent CALB pocket prediction, for example the number, size, or location of a predicted pocket."
        evidence: "Cite the report or matching field for the result actually summarized."
  T2-SR-11:
    fact_ids: []
    requirements:
      - id: mutant_energy
        report_ids: [1tca_mut_energy]
        acceptance: "Summarize a main computed energy result for G107A, such as total potential energy or a correctly explained material contribution from its energy terms."
        evidence: "Cite the report or matching field for the result actually summarized."
  T2-SR-12:
    rationale: Summarize the modeled contacts between CALB and its ligand.
    fact_ids: []
    requirements:
      - id: protein_substrate_contacts
        report_ids: [1tca_wt_interaction]
        acceptance: "State at least one correct contact result for 4-nitrophenyl butyrate, such as four protein-substrate van der Waals contacts, zero protein-substrate hydrogen bonds, or another verified protein-substrate observation. Overall or intra-enzyme totals alone are insufficient."
        evidence: "Cite the interaction report as the source of the specific protein-substrate observation."
  T2-MI-01:
    fact_ids: []
    requirements:
      - id: flexibility
        report_ids: [1mxt_wt_flexibility]
        acceptance: "Describe a supported flexibility observation, such as a correctly identified RMSF statistic or region."
        evidence: "Identify the flexibility report or its relevant field as the source for the result actually stated."
      - id: disorder
        report_ids: [1mxt_wt_disorder]
        acceptance: "Describe a supported disorder observation, such as a reported region count, extent, or position."
        evidence: "Identify the disorder report or its relevant field as the source for the result actually stated."
  T2-MI-02:
    fact_ids: []
    requirements:
      - id: aaprops
        report_ids: [1mxt_wt_aaprops]
        acceptance: "Describe a supported residue property, such as accessibility or a backbone-angle observation. A record count alone is insufficient."
        evidence: "Identify the aaprops report or its relevant field as the source for the result actually stated."
      - id: hydrocluster
        report_ids: [1mxt_wt_hydrocluster]
        acceptance: "Describe a supported hydrophobic-cluster finding, such as the reported count or area of prominent clusters."
        evidence: "Identify the hydrocluster report or its relevant field as the source for the result actually stated."
      - id: pocket
        report_ids: [1mxt_wt_pocket]
        acceptance: "Describe a supported pocket prediction, such as a prominent pocket size, location, or count."
        evidence: "Identify the pocket report or its relevant field as the source for the result actually stated."
  T2-MI-03:
    fact_ids: []
    requirements:
      - id: conservation
        report_ids: [1mxt_wt_conservation]
        acceptance: "Describe a supported conservation result, such as the range, mean, or a residue-specific observation of a named conservation score."
        evidence: "Identify the conservation report or its relevant field as the source for the result actually stated."
      - id: embedding
        report_ids: [1mxt_wt_embedding]
        acceptance: "Describe a supported property of the sequence embeddings, such as their dimensionality or per-residue organization, and distinguish it from a conservation score."
        evidence: "Identify the embedding report or its relevant field as the source for the result actually stated."
  T2-MI-04:
    fact_ids: []
    requirements:
      - id: substrate
        report_ids: [1mxt_wt_substrate]
        acceptance: "Identify a supported preparation-stage result, such as the prepared substrate identity, entry count, or a reported molecular property."
        evidence: "Identify the substrate report or its relevant field as the source for the result actually stated."
      - id: dock
        report_ids: [1mxt_wt_dock]
        acceptance: "Identify the actual docked ligand and state a supported docking result, such as its score. The internal complex identifier is optional."
        evidence: "Identify the dock report or its relevant field as the source for the result actually stated."
      - id: interaction
        report_ids: [1mxt_wt_interaction]
        acceptance: "State at least one supported modeled contact result for the ligand. Any verified protein-substrate contact can qualify, including a reported absence of a contact type. Overall or intra-enzyme counts alone are insufficient."
        evidence: "Identify the interaction report or its relevant field as the source for the result actually stated."
  T2-MI-05:
