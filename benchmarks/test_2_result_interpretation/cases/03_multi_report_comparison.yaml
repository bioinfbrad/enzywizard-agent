cases:
  - {case_id: T2-MC-01, enzyme_id: 1MXT, scope: paired, question: "Using the recorded T244M mutation mapping, compare the WT and mutant cholesterol oxidase energy reports and preserve side-specific evidence.", report_ids: [1mxt_mut_clean, 1mxt_wt_energy, 1mxt_mut_energy], required_facts: ["confirm the mapped substitution", "attribute observations to WT and MUT"], forbidden_claims: ["the mutation experimentally improves activity"]}
  - {case_id: T2-MC-02, enzyme_id: 1MXT, scope: paired, question: "Compare WT and T244M cholesterol oxidase flexibility results.", report_ids: [1mxt_wt_flexibility, 1mxt_mut_flexibility], required_facts: ["compare both sides"], required_limitations: ["computed differences do not prove phenotype"]}
  - {case_id: T2-MC-03, enzyme_id: 1MXT, scope: paired, question: "Compare the WT and T244M disorder reports and state any uncertainty.", report_ids: [1mxt_wt_disorder, 1mxt_mut_disorder], required_facts: ["preserve side attribution"], required_limitations: ["disorder predictions are computational"]}
  - {case_id: T2-MC-04, enzyme_id: 1MXT, scope: cross_report, question: "Compare the current cholesterol oxidase pocket report with its current hydrophobic-cluster report.", report_ids: [1mxt_wt_pocket, 1mxt_wt_hydrocluster], required_facts: ["compare reports without treating them as identical evidence"], required_limitations: ["structural associations do not establish binding"]}
  - {case_id: T2-MC-05, enzyme_id: 1IU4, scope: paired, question: "Using the recorded S72N mutation mapping, compare the WT and mutant microbial transglutaminase conservation reports.", report_ids: [1iu4_mut_clean, 1iu4_wt_conservation, 1iu4_mut_conservation], required_facts: ["compare a supported conservation feature across WT and S72N", "preserve WT and MUT identities"], forbidden_claims: ["the substitution proves a functional effect"]}
  - {case_id: T2-MC-06, enzyme_id: 1IU4, scope: paired, question: "Compare WT and S72N embedding reports and explain what differs at the representation level.", report_ids: [1iu4_wt_embedding, 1iu4_mut_embedding], required_facts: ["compare representation evidence"], required_limitations: ["embedding differences do not prove activity changes"]}
  - {case_id: T2-MC-07, enzyme_id: 1IU4, scope: cross_report, question: "Compare microbial transglutaminase energy and flexibility reports as complementary dimensions.", report_ids: [1iu4_wt_energy, 1iu4_wt_flexibility], required_facts: ["distinguish the metrics"], required_limitations: ["association is not causation"]}
  - {case_id: T2-MC-08, enzyme_id: 1IU4, scope: cross_report, question: "Compare the microbial transglutaminase pocket and hydrophobic-cluster reports.", report_ids: [1iu4_wt_pocket, 1iu4_wt_hydrocluster], required_facts: ["retain both evidence types"], required_limitations: ["pocket predictions require validation"]}
  - {case_id: T2-MC-09, enzyme_id: 1TCA, scope: paired, question: "Using the recorded G107A mutation mapping, compare the WT and mutant CALB energy reports.", report_ids: [1tca_mut_clean, 1tca_wt_energy, 1tca_mut_energy], required_facts: ["confirm the mapped substitution", "attribute differences to WT and MUT"], forbidden_claims: ["the mutation caused an activity change"]}
  - {case_id: T2-MC-10, enzyme_id: 1TCA, scope: paired, question: "Compare WT and G107A CALB pocket predictions.", report_ids: [1tca_wt_pocket, 1tca_mut_pocket], required_facts: ["preserve side attribution"], required_limitations: ["pocket differences are hypotheses"]}
  - {case_id: T2-MC-11, enzyme_id: 1TCA, scope: paired, question: "Compare WT and G107A CALB docking reports for 4-nitrophenyl butyrate.", report_ids: [1tca_wt_dock, 1tca_mut_dock], required_facts: ["compare both docking reports"], required_limitations: ["docking is not an experimental affinity measurement"]}
