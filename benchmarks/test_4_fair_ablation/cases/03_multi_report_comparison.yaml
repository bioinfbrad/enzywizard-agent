  - case_id: T2-MC-11
    enzyme_id: 1TCA
    scope: paired
    question: "Compare WT and G107A CALB docking reports for 4-nitrophenyl butyrate."
    report_ids:
      - 1tca_wt_dock
      - 1tca_mut_dock
    target_term: "binding affinity"
    definition_question: "What is the definition of ‘binding affinity’?"
    reference_definition: "In AutoDock Vina output, binding affinity is a predicted receptor-ligand binding score reported in kcal/mol for a docking pose."
  - case_id: T2-MC-12
