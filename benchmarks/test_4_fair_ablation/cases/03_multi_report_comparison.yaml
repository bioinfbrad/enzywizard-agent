    target_term: "amino acid substitution"
    definition_question: "What is the definition of ‘amino acid substitution’?"
    reference_definition: "A sequence variant of a codon resulting in the substitution of one amino acid for another in the resulting polypeptide."
  - case_id: T2-MC-10
    enzyme_id: 1TCA
    scope: paired
    question: "Compare WT and G107A CALB pocket predictions."
    report_ids:
      - 1tca_wt_pocket
      - 1tca_mut_pocket
    target_term: "binding pocket"
    definition_question: "What is the definition of ‘binding pocket’?"
