    target_term: "sequence conservation"
    definition_question: "What is the definition of ‘sequence conservation’?"
    reference_definition: "Sequence conservation describes the retention of identical or similar residues at corresponding positions across evolutionarily related sequences, often assessed using multiple sequence alignments."
