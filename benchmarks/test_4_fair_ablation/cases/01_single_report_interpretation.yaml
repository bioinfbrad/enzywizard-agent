schema_version: 1
category_id: single_report_interpretation
case_count: 12
cases:
  - case_id: T2-SR-01
    enzyme_id: 1MXT
    scope: wt
    question: "Summarize the main findings in the cholesterol oxidase flexibility report."
    report_ids:
      - 1mxt_wt_flexibility
    target_term: "root mean square fluctuation"
    definition_question: "What is the definition of ‘root mean square fluctuation’?"
    reference_definition: "gmx rmsf computes the root mean square fluctuation (RMSF, i.e. standard deviation) of atomic positions in the trajectory (supplied with -f ) after (optionally) fitting to a reference frame (supplied with -s )."
  - case_id: T2-SR-02
    enzyme_id: 1MXT
    scope: wt
    question: "What does the cholesterol oxidase pocket report indicate about predicted binding pockets?"
    report_ids:
      - 1mxt_wt_pocket
    target_term: "binding pocket"
    definition_question: "What is the definition of ‘binding pocket’?"
    reference_definition: "In PyVOL, a protein binding pocket is a cavity identified from the protein's solvent-excluded geometry; PyVOL can calculate its volume and partition it into sub-pockets."
  - case_id: T2-SR-03
    enzyme_id: 1MXT
    scope: mut
    question: "Summarize the disorder findings for the T244M cholesterol oxidase variant."
    report_ids:
      - 1mxt_mut_disorder
    target_term: "intrinsically disordered region"
    definition_question: "What is the definition of ‘intrinsically disordered region’?"
    reference_definition: "An intrinsically disordered region (IDR) is a segment of a protein that lacks a stable, well-defined three-dimensional structure under physiological conditions when considered in isolation."
  - case_id: T2-SR-04
    enzyme_id: 1MXT
    scope: wt
    question: "Explain the residue-property results for cholesterol oxidase."
    report_ids:
      - 1mxt_wt_aaprops
    target_term: "solvent accessibility"
    definition_question: "What is the definition of ‘solvent accessibility’?"
    reference_definition: "Data on the solvent accessible or buried surface area of a protein structure."
  - case_id: T2-SR-05
    enzyme_id: 1IU4
    scope: wt
    question: "Summarize the energy report for microbial transglutaminase."
    report_ids:
      - 1iu4_wt_energy
    target_term: "potential energy"
    definition_question: "What is the definition of ‘potential energy’?"
    reference_definition: "Potential energy is the energy of position or orientation in a field of force."
  - case_id: T2-SR-06
    enzyme_id: 1IU4
    scope: wt
    question: "Explain the predicted hydrophobic clusters in microbial transglutaminase."
    report_ids:
      - 1iu4_wt_hydrocluster
    target_term: "hydrophobic cluster"
    definition_question: "What is the definition of ‘hydrophobic cluster’?"
    reference_definition: "Hydrophobic clusters are connected groups of contacting hydrophobic residues in a protein, often involving isoleucine, leucine and valine side chains; ProteinTools identifies clusters from a residue-contact graph."
  - case_id: T2-SR-07
    enzyme_id: 1IU4
    scope: mut
    question: "What does the S72N conservation report show?"
    report_ids:
      - 1iu4_mut_conservation
    target_term: "sequence conservation"
    definition_question: "What is the definition of ‘sequence conservation’?"
    reference_definition: "Sequence conservation describes the retention of identical or similar residues at corresponding positions across evolutionarily related sequences, often assessed using multiple sequence alignments."
  - case_id: T2-SR-08
    enzyme_id: 1IU4
    scope: wt
    question: "Summarize the microbial transglutaminase substrate-preparation report."
    report_ids:
