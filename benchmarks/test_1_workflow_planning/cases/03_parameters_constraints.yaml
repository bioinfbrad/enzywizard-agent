expected_case_count: 12
cases:
- case_id: T1-PC01
  description: "Explicit cholesterol oxidase clean parameters"
  enzyme_id: 1MXT
  request: "Clean only at pH 6.5 and do not add hydrogens."
  input_profile: 1mxt_single
  reference_answers:
  - {workflow: [clean], answer: "Run enzywizard-clean. Use enzywizard-clean:single.pH = 6.5, enzywizard-clean:single.add_H = false. Produce the required artifacts:
      cleaned_structure_cif (single), cleaned_structure_pdb (single), cleaned_sequence_fasta (single), clean_report_json (single)."}
  expected_trajectories:
  - workflow:
    - clean
    events:
    - "Record the routed request."
    - "Record and approve the final plan: enzywizard-clean."
    - "Execute the final plan with the milestone dependencies respected."
    - "Record the produced files and terminal execution status."
  scoring:
  - profiles:
    - clean
    milestones:
      request: {kind: routing, after: [], stage: 1, actions: [run_tool_workflow]}
      plan1: {kind: plan, after: [request], stage: 1, allowed: ['enzywizard-clean:single']}
      plan1/enzywizard-clean:single: {kind: plan_call, after: [plan1], stage: 1, key: 'enzywizard-clean:single', dependencies: [], parameters: [{tool: enzywizard-clean, side: single,
            parameter: pH, accepted_values: [6.5]}, {tool: enzywizard-clean, side: single, parameter: add_H, accepted_values: [false]}], reuse_inputs: {}}
      approval: {kind: approval, after: ['plan1/enzywizard-clean:single'], stage: 1}
      execute/enzywizard-clean:single: {kind: execution_call, after: [approval], key: 'enzywizard-clean:single', dependencies: [], parameters: [{tool: enzywizard-clean, side: single,
            parameter: pH, accepted_values: [6.5]}, {tool: enzywizard-clean, side: single, parameter: add_H, accepted_values: [false]}], reuse_inputs: {}}
      artifact/cleaned_structure_cif:single/1.1: {kind: artifact, after: ['execute/enzywizard-clean:single'], artifact_type: cleaned_structure_cif, side: single, producers: ['enzywizard-clean:single']}
      artifact/cleaned_structure_pdb:single/2.1: {kind: artifact, after: ['execute/enzywizard-clean:single'], artifact_type: cleaned_structure_pdb, side: single, producers: ['enzywizard-clean:single']}
      artifact/cleaned_sequence_fasta:single/3.1: {kind: artifact, after: ['execute/enzywizard-clean:single'], artifact_type: cleaned_sequence_fasta, side: single, producers: ['enzywizard-clean:single']}
      artifact/clean_report_json:single/4.1: {kind: artifact, after: ['execute/enzywizard-clean:single'], artifact_type: clean_report_json, side: single, producers: ['enzywizard-clean:single']}
      complete: {kind: terminal, after: ['execute/enzywizard-clean:single', 'artifact/cleaned_structure_cif:single/1.1', 'artifact/cleaned_structure_pdb:single/2.1', 'artifact/cleaned_sequence_fasta:single/3.1',
          'artifact/clean_report_json:single/4.1']}
    minefields:
      forbidden_tools_by_plan_stage:
      - []
      execution_call_limits: {'enzywizard-clean:single': 1}
      executed_revoked_plan: true
      wrong_historical_source: true
      wrong_historical_input: null
    success:
      required_artifacts:
      - {artifact_type: cleaned_structure_cif, side: single, count: 1, producers: ['enzywizard-clean:single']}
      - {artifact_type: cleaned_structure_pdb, side: single, count: 1, producers: ['enzywizard-clean:single']}
      - {artifact_type: cleaned_sequence_fasta, side: single, count: 1, producers: ['enzywizard-clean:single']}
      - {artifact_type: clean_report_json, side: single, count: 1, producers: ['enzywizard-clean:single']}
