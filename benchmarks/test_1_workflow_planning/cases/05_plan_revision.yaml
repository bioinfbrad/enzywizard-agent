schema_version: 1
category_id: plan_revision
title: "User intervention, plan revision, and replanning"
description: "True multi-turn cases in which a generated plan is revised before execution."
expected_case_count: 12
cases:
- case_id: T1-RV01
  description: "Replace pockets with flexibility"
  enzyme_id: 1MXT
  initial_request: "Analyze energy and binding pockets."
  revision_request: "Replace binding-pocket analysis with flexibility analysis."
  input_profile: 1mxt_single
  reference_answers:
  - {workflow: [energy_pocket, energy_flexibility], answer: "Propose enzywizard-clean -> enzywizard-energy -> enzywizard-pocket -> enzywizard-integrate. Apply the requested
      revision and execute only the approved final plan: enzywizard-clean -> enzywizard-energy -> enzywizard-flexibility
      -> enzywizard-integrate. Produce the required artifacts: cleaned_structure_cif (single), cleaned_structure_pdb
      (single), cleaned_sequence_fasta (single), clean_report_json (single), energy_report_json (single),
      flexibility_report_json (single), integrate_report_json (single), integrate_nodes_json (single),
      integrate_edges_json (single)."}
  expected_trajectories:
  - workflow:
    - energy_pocket
    - energy_flexibility
    events:
    - "Record the routed request."
    - "Record the initial plan: enzywizard-clean -> enzywizard-energy -> enzywizard-pocket -> enzywizard-integrate."
    - "Record the revision request and supersede the initial plan."
    - "Record and approve the final plan: enzywizard-clean -> enzywizard-energy -> enzywizard-flexibility -> enzywizard-integrate."
    - "Execute the final plan with the milestone dependencies respected."
    - "Record the produced files and terminal execution status."
  scoring:
  - profiles:
    - energy_pocket
    - energy_flexibility
    milestones:
      request: {kind: routing, after: [], stage: 1, actions: [run_tool_workflow]}
      plan1: {kind: plan, after: [request], stage: 1, allowed: ['enzywizard-clean:single', 'enzywizard-energy:single', 'enzywizard-pocket:single', 'enzywizard-integrate:single']}
      plan1/enzywizard-clean:single: {kind: plan_call, after: [plan1], stage: 1, key: 'enzywizard-clean:single', dependencies: [], parameters: [], reuse_inputs: {}}
      plan1/enzywizard-energy:single: {kind: plan_call, after: [plan1, 'plan1/enzywizard-clean:single'], stage: 1, key: 'enzywizard-energy:single', dependencies: ['enzywizard-clean:single'],
        parameters: [], reuse_inputs: {}}
      plan1/enzywizard-pocket:single: {kind: plan_call, after: [plan1, 'plan1/enzywizard-clean:single'], stage: 1, key: 'enzywizard-pocket:single', dependencies: ['enzywizard-clean:single'],
        parameters: [], reuse_inputs: {}}
      plan1/enzywizard-integrate:single: {kind: plan_call, after: [plan1, 'plan1/enzywizard-energy:single', 'plan1/enzywizard-pocket:single'], stage: 1, key: 'enzywizard-integrate:single',
        dependencies: ['enzywizard-energy:single', 'enzywizard-pocket:single'], parameters: [], reuse_inputs: {}}
      revision: {kind: revision, after: ['plan1/enzywizard-clean:single', 'plan1/enzywizard-energy:single', 'plan1/enzywizard-pocket:single', 'plan1/enzywizard-integrate:single'], stage: 1,
        request: Replace binding-pocket analysis with flexibility analysis.}
      plan2: {kind: plan, after: [revision], stage: 2, allowed: ['enzywizard-clean:single', 'enzywizard-energy:single', 'enzywizard-flexibility:single', 'enzywizard-integrate:single']}
      plan2/enzywizard-clean:single: {kind: plan_call, after: [plan2], stage: 2, key: 'enzywizard-clean:single', dependencies: [], parameters: [], reuse_inputs: {}}
      plan2/enzywizard-energy:single: {kind: plan_call, after: [plan2, 'plan2/enzywizard-clean:single'], stage: 2, key: 'enzywizard-energy:single', dependencies: ['enzywizard-clean:single'],
        parameters: [], reuse_inputs: {}}
      plan2/enzywizard-flexibility:single: {kind: plan_call, after: [plan2, 'plan2/enzywizard-clean:single'], stage: 2, key: 'enzywizard-flexibility:single', dependencies: ['enzywizard-clean:single'],
        parameters: [], reuse_inputs: {}}
      plan2/enzywizard-integrate:single: {kind: plan_call, after: [plan2, 'plan2/enzywizard-energy:single', 'plan2/enzywizard-flexibility:single'], stage: 2, key: 'enzywizard-integrate:single',
        dependencies: ['enzywizard-energy:single', 'enzywizard-flexibility:single'], parameters: [], reuse_inputs: {}}
      approval: {kind: approval, after: ['plan2/enzywizard-clean:single', 'plan2/enzywizard-energy:single', 'plan2/enzywizard-flexibility:single', 'plan2/enzywizard-integrate:single'],
        stage: 2}
      execute/enzywizard-clean:single: {kind: execution_call, after: [approval], key: 'enzywizard-clean:single', dependencies: [], parameters: [], reuse_inputs: {}}
      execute/enzywizard-energy:single: {kind: execution_call, after: [approval, 'execute/enzywizard-clean:single'], key: 'enzywizard-energy:single', dependencies: ['enzywizard-clean:single'],
        parameters: [], reuse_inputs: {}}
      execute/enzywizard-flexibility:single: {kind: execution_call, after: [approval, 'execute/enzywizard-clean:single'], key: 'enzywizard-flexibility:single', dependencies: ['enzywizard-clean:single'],
        parameters: [], reuse_inputs: {}}
      execute/enzywizard-integrate:single: {kind: execution_call, after: [approval, 'execute/enzywizard-energy:single', 'execute/enzywizard-flexibility:single'], key: 'enzywizard-integrate:single',
        dependencies: ['enzywizard-energy:single', 'enzywizard-flexibility:single'], parameters: [], reuse_inputs: {}}
      artifact/cleaned_structure_cif:single/1.1: {kind: artifact, after: ['execute/enzywizard-clean:single'], artifact_type: cleaned_structure_cif, side: single, producers: ['enzywizard-clean:single']}
      artifact/cleaned_structure_pdb:single/2.1: {kind: artifact, after: ['execute/enzywizard-clean:single'], artifact_type: cleaned_structure_pdb, side: single, producers: ['enzywizard-clean:single']}
      artifact/cleaned_sequence_fasta:single/3.1: {kind: artifact, after: ['execute/enzywizard-clean:single'], artifact_type: cleaned_sequence_fasta, side: single, producers: ['enzywizard-clean:single']}
      artifact/clean_report_json:single/4.1: {kind: artifact, after: ['execute/enzywizard-clean:single'], artifact_type: clean_report_json, side: single, producers: ['enzywizard-clean:single']}
      artifact/energy_report_json:single/5.1: {kind: artifact, after: ['execute/enzywizard-energy:single'], artifact_type: energy_report_json, side: single, producers: ['enzywizard-energy:single']}
      artifact/flexibility_report_json:single/6.1: {kind: artifact, after: ['execute/enzywizard-flexibility:single'], artifact_type: flexibility_report_json, side: single, producers: [
          'enzywizard-flexibility:single']}
      artifact/integrate_report_json:single/7.1: {kind: artifact, after: ['execute/enzywizard-integrate:single'], artifact_type: integrate_report_json, side: single, producers: ['enzywizard-integrate:single']}
      artifact/integrate_nodes_json:single/8.1: {kind: artifact, after: ['execute/enzywizard-integrate:single'], artifact_type: integrate_nodes_json, side: single, producers: ['enzywizard-integrate:single']}
      artifact/integrate_edges_json:single/9.1: {kind: artifact, after: ['execute/enzywizard-integrate:single'], artifact_type: integrate_edges_json, side: single, producers: ['enzywizard-integrate:single']}
      complete: {kind: terminal, after: ['execute/enzywizard-clean:single', 'execute/enzywizard-energy:single', 'execute/enzywizard-flexibility:single', 'execute/enzywizard-integrate:single',
          'artifact/cleaned_structure_cif:single/1.1', 'artifact/cleaned_structure_pdb:single/2.1', 'artifact/cleaned_sequence_fasta:single/3.1', 'artifact/clean_report_json:single/4.1',
          'artifact/energy_report_json:single/5.1', 'artifact/flexibility_report_json:single/6.1', 'artifact/integrate_report_json:single/7.1', 'artifact/integrate_nodes_json:single/8.1',
          'artifact/integrate_edges_json:single/9.1']}
    minefields:
      forbidden_tools_by_plan_stage:
      - []
      - []
      execution_call_limits: {'enzywizard-clean:single': 1, 'enzywizard-energy:single': 1, 'enzywizard-flexibility:single': 1, 'enzywizard-integrate:single': 1}
      executed_revoked_plan: true
      wrong_historical_source: true
      wrong_historical_input: null
    success:
      required_artifacts:
      - {artifact_type: cleaned_structure_cif, side: single, count: 1, producers: ['enzywizard-clean:single']}
      - {artifact_type: cleaned_structure_pdb, side: single, count: 1, producers: ['enzywizard-clean:single']}
      - {artifact_type: cleaned_sequence_fasta, side: single, count: 1, producers: ['enzywizard-clean:single']}
      - {artifact_type: clean_report_json, side: single, count: 1, producers: ['enzywizard-clean:single']}
      - {artifact_type: energy_report_json, side: single, count: 1, producers: ['enzywizard-energy:single']}
      - {artifact_type: flexibility_report_json, side: single, count: 1, producers: ['enzywizard-flexibility:single']}
      - {artifact_type: integrate_report_json, side: single, count: 1, producers: ['enzywizard-integrate:single']}
      - {artifact_type: integrate_nodes_json, side: single, count: 1, producers: ['enzywizard-integrate:single']}
      - {artifact_type: integrate_edges_json, side: single, count: 1, producers: ['enzywizard-integrate:single']}
      forbidden_executions:
      - enzywizard-pocket
      exclusive_execution_tools: []
      required_parameters: []
      required_historical_input: null
