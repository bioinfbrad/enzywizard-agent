        parameters: [], reuse_inputs: {}}
      approval: {kind: approval, after: ['plan1/enzywizard-clean:single', 'plan1/enzywizard-pocket:single', 'plan1/enzywizard-integrate:single'], stage: 1}
      execute/enzywizard-clean:single: {kind: execution_call, after: [approval], key: 'enzywizard-clean:single', dependencies: [], parameters: [], reuse_inputs: {}}
      execute/enzywizard-pocket:single: {kind: execution_call, after: [approval, 'execute/enzywizard-clean:single'], key: 'enzywizard-pocket:single', dependencies: ['enzywizard-clean:single'],
        parameters: [], reuse_inputs: {}}
      execute/enzywizard-integrate:single: {kind: execution_call, after: [approval, 'execute/enzywizard-pocket:single'], key: 'enzywizard-integrate:single', dependencies: ['enzywizard-pocket:single'],
        parameters: [], reuse_inputs: {}}
      artifact/cleaned_structure_cif:single/1.1: {kind: artifact, after: ['execute/enzywizard-clean:single'], artifact_type: cleaned_structure_cif, side: single, producers: ['enzywizard-clean:single']}
      artifact/cleaned_structure_pdb:single/2.1: {kind: artifact, after: ['execute/enzywizard-clean:single'], artifact_type: cleaned_structure_pdb, side: single, producers: ['enzywizard-clean:single']}
      artifact/cleaned_sequence_fasta:single/3.1: {kind: artifact, after: ['execute/enzywizard-clean:single'], artifact_type: cleaned_sequence_fasta, side: single, producers: ['enzywizard-clean:single']}
