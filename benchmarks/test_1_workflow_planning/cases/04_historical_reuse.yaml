schema_version: 1
category_id: historical_reuse
title: "Historical artifact reuse"
description: "Reuse, inspection, or recomputation requests grounded in explicit prior turns and fixed historical artifacts."
expected_case_count: 12
cases:
- case_id: T1-HR01
  description: "Reuse cholesterol oxidase cleaned structure for energy"
  enzyme_id: 1MXT
  request: "Reuse the cleaned structure from turn 1 and run energy analysis."
  input_profile: 1mxt_single
  history:
    turn_id: 1
    operation: reuse_as_input
    artifacts:
    - artifact_type: cleaned_structure_cif
      side: single
      artifact_path: resources/history_fixtures/1MXT/clean/cleaned_structure.cif
    - artifact_type: cleaned_sequence_fasta
      side: single
      artifact_path: resources/enzymes/1MXT/single/sequence.fasta
    - artifact_type: clean_report_json
      side: single
      artifact_path: resources/history_fixtures/1MXT/clean/clean_report.json
    reuse_policy: required
  reference_answers:
  - {workflow: [reused_energy], answer: "Reuse the historical cleaned structure from turn 1. Run enzywizard-energy -> enzywizard-integrate. Produce the required artifacts:
      energy_report_json (single), integrate_report_json (single), integrate_nodes_json (single), integrate_edges_json (single)."}
  expected_trajectories:
  - workflow:
    - reused_energy
    events:
    - "Record the routed request."
    - "Resolve the required historical source before planning."
    - "Record and approve the final plan: enzywizard-energy -> enzywizard-integrate."
    - "Execute the final plan with the milestone dependencies respected."
    - "Record the produced files and terminal execution status."
  scoring:
  - profiles:
    - reused_energy
    milestones:
      request: {kind: routing, after: [], stage: 1, actions: [reuse_historical_output, run_tool_workflow]}
      history: {kind: history, after: [request], turn: 1, operations: [reuse_as_input], accepted_artifact_types: [cleaned_structure_cif, clean_report_json]}
      plan1: {kind: plan, after: [request, history], stage: 1, allowed: ['enzywizard-energy:single', 'enzywizard-integrate:single']}
      plan1/enzywizard-energy:single: {kind: plan_call, after: [plan1], stage: 1, key: 'enzywizard-energy:single', dependencies: [], parameters: [], reuse_inputs: {input_path: cleaned_structure_cif}}
      plan1/enzywizard-integrate:single: {kind: plan_call, after: [plan1, 'plan1/enzywizard-energy:single'], stage: 1, key: 'enzywizard-integrate:single', dependencies: ['enzywizard-energy:single'],
        parameters: [], reuse_inputs: {}}
      approval: {kind: approval, after: ['plan1/enzywizard-energy:single', 'plan1/enzywizard-integrate:single'], stage: 1}
      execute/enzywizard-energy:single: {kind: execution_call, after: [approval], key: 'enzywizard-energy:single', dependencies: [], parameters: [], reuse_inputs: {input_path: cleaned_structure_cif}}
      execute/enzywizard-integrate:single: {kind: execution_call, after: [approval, 'execute/enzywizard-energy:single'], key: 'enzywizard-integrate:single', dependencies: ['enzywizard-energy:single'],
        parameters: [], reuse_inputs: {}}
      artifact/energy_report_json:single/1.1: {kind: artifact, after: ['execute/enzywizard-energy:single'], artifact_type: energy_report_json, side: single, producers: ['enzywizard-energy:single']}
      artifact/integrate_report_json:single/2.1: {kind: artifact, after: ['execute/enzywizard-integrate:single'], artifact_type: integrate_report_json, side: single, producers: ['enzywizard-integrate:single']}
      artifact/integrate_nodes_json:single/3.1: {kind: artifact, after: ['execute/enzywizard-integrate:single'], artifact_type: integrate_nodes_json, side: single, producers: ['enzywizard-integrate:single']}
      artifact/integrate_edges_json:single/4.1: {kind: artifact, after: ['execute/enzywizard-integrate:single'], artifact_type: integrate_edges_json, side: single, producers: ['enzywizard-integrate:single']}
      complete: {kind: terminal, after: ['execute/enzywizard-energy:single', 'execute/enzywizard-integrate:single', 'artifact/energy_report_json:single/1.1', 'artifact/integrate_report_json:single/2.1',
          'artifact/integrate_nodes_json:single/3.1', 'artifact/integrate_edges_json:single/4.1']}
    minefields:
      forbidden_tools_by_plan_stage:
      - []
      execution_call_limits: {'enzywizard-energy:single': 1, 'enzywizard-integrate:single': 1}
      executed_revoked_plan: true
      wrong_historical_source: true
      wrong_historical_input: {tool: enzywizard-energy, inputs: {input_path: cleaned_structure_cif}}
    success:
      required_artifacts:
      - {artifact_type: energy_report_json, side: single, count: 1, producers: ['enzywizard-energy:single']}
      - {artifact_type: integrate_report_json, side: single, count: 1, producers: ['enzywizard-integrate:single']}
      - {artifact_type: integrate_nodes_json, side: single, count: 1, producers: ['enzywizard-integrate:single']}
      - {artifact_type: integrate_edges_json, side: single, count: 1, producers: ['enzywizard-integrate:single']}
      forbidden_executions: []
      exclusive_execution_tools: []
      required_parameters: []
      required_historical_input: {tool: enzywizard-energy, inputs: {input_path: cleaned_structure_cif}}
- case_id: T1-HR02
