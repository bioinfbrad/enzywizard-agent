    - reused_disorder
    milestones:
      request: {kind: routing, after: [], stage: 1, actions: [list_artifacts, reuse_historical_output, run_tool_workflow]}
      history: {kind: history, after: [request], turn: 1, operations: [list_artifacts, reuse_as_input], accepted_artifact_types: [cleaned_structure_cif, clean_report_json]}
      plan1: {kind: plan, after: [request, history], stage: 1, allowed: ['enzywizard-disorder:single', 'enzywizard-integrate:single']}
      plan1/enzywizard-disorder:single: {kind: plan_call, after: [plan1], stage: 1, key: 'enzywizard-disorder:single', dependencies: [], parameters: [], reuse_inputs: {input_path: cleaned_structure_cif}}
      plan1/enzywizard-integrate:single: {kind: plan_call, after: [plan1, 'plan1/enzywizard-disorder:single'], stage: 1, key: 'enzywizard-integrate:single', dependencies: ['enzywizard-disorder:single'],
        parameters: [], reuse_inputs: {}}
      approval: {kind: approval, after: ['plan1/enzywizard-disorder:single', 'plan1/enzywizard-integrate:single'], stage: 1}
      execute/enzywizard-disorder:single: {kind: execution_call, after: [approval], key: 'enzywizard-disorder:single', dependencies: [], parameters: [], reuse_inputs: {input_path: cleaned_structure_cif}}
      execute/enzywizard-integrate:single: {kind: execution_call, after: [approval, 'execute/enzywizard-disorder:single'], key: 'enzywizard-integrate:single', dependencies: ['enzywizard-disorder:single'],
        parameters: [], reuse_inputs: {}}
      artifact/disorder_report_json:single/1.1: {kind: artifact, after: ['execute/enzywizard-disorder:single'], artifact_type: disorder_report_json, side: single, producers: ['enzywizard-disorder:single']}
      artifact/integrate_report_json:single/2.1: {kind: artifact, after: ['execute/enzywizard-integrate:single'], artifact_type: integrate_report_json, side: single, producers: ['enzywizard-integrate:single']}
      artifact/integrate_nodes_json:single/3.1: {kind: artifact, after: ['execute/enzywizard-integrate:single'], artifact_type: integrate_nodes_json, side: single, producers: ['enzywizard-integrate:single']}
      artifact/integrate_edges_json:single/4.1: {kind: artifact, after: ['execute/enzywizard-integrate:single'], artifact_type: integrate_edges_json, side: single, producers: ['enzywizard-integrate:single']}
      complete: {kind: terminal, after: ['execute/enzywizard-disorder:single', 'execute/enzywizard-integrate:single', 'artifact/disorder_report_json:single/1.1', 'artifact/integrate_report_json:single/2.1',
          'artifact/integrate_nodes_json:single/3.1', 'artifact/integrate_edges_json:single/4.1']}
    minefields:
