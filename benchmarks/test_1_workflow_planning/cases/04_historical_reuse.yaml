- case_id: T1-HR04
  description: "Extend a prior cholesterol oxidase plan"
  enzyme_id: 1MXT
  request: "Use the previous approved energy and flexibility plan as the starting point, add disorder analysis, and run the revised workflow."
  input_profile: 1mxt_single
  history:
    turn_id: 2
    operation: reuse_plan
    prior_plan:
      plan_profile: energy_flexibility
      parameters:
      - tool: enzywizard-clean
        side: single
        parameter: add_H
        value: true
      - tool: enzywizard-clean
        side: single
        parameter: pH
        value: 7.0
      - tool: enzywizard-energy
        side: single
        parameter: minimize_energy
        value: true
      - tool: enzywizard-energy
        side: single
        parameter: minimization_iteration
        value: 100
      - tool: enzywizard-flexibility
        side: single
        parameter: method
        value: ANM
      - tool: enzywizard-flexibility
        side: single
        parameter: cutoff
        value: 15.0
      - tool: enzywizard-flexibility
        side: single
        parameter: n_modes
        value: 20
  reference_answers:
  - {workflow: [dynamics], answer: "Use the approved plan from turn 2 as specified in the question. Run enzywizard-clean -> enzywizard-energy -> enzywizard-flexibility ->
      enzywizard-disorder -> enzywizard-integrate. Use enzywizard-clean:single.add_H = true, enzywizard-clean:single.pH = 7.0,
      enzywizard-energy:single.minimize_energy = true, enzywizard-energy:single.minimization_iteration = 100, enzywizard-flexibility:single.method
      = ANM, enzywizard-flexibility:single.cutoff = 15.0, enzywizard-flexibility:single.n_modes = 20. Produce the required artifacts:
      cleaned_structure_cif (single), cleaned_structure_pdb (single), cleaned_sequence_fasta (single), clean_report_json (single),
      energy_report_json (single), flexibility_report_json (single), disorder_report_json (single), integrate_report_json (single),
      integrate_nodes_json (single), integrate_edges_json (single)."}
  expected_trajectories:
  - workflow:
    - dynamics
    events:
    - "Record the routed request."
    - "Record and approve the final plan: enzywizard-clean -> enzywizard-energy -> enzywizard-flexibility -> enzywizard-disorder -> enzywizard-integrate."
    - "Execute the final plan with the milestone dependencies respected."
    - "Record the produced files and terminal execution status."
  scoring:
  - profiles:
    - dynamics
    milestones:
      request: {kind: routing, after: [], stage: 1, actions: [reference_historical_context, run_tool_workflow]}
      plan1: {kind: plan, after: [request], stage: 1, allowed: ['enzywizard-clean:single', 'enzywizard-energy:single', 'enzywizard-flexibility:single', 'enzywizard-disorder:single',
          'enzywizard-integrate:single']}
      plan1/enzywizard-clean:single: {kind: plan_call, after: [plan1], stage: 1, key: 'enzywizard-clean:single', dependencies: [], parameters: [{tool: enzywizard-clean, side: single,
            parameter: add_H, value: true, accepted_values: [true]}, {tool: enzywizard-clean, side: single, parameter: pH, value: 7.0, accepted_values: [7.0]}], reuse_inputs: {}}
      plan1/enzywizard-energy:single: {kind: plan_call, after: [plan1, 'plan1/enzywizard-clean:single'], stage: 1, key: 'enzywizard-energy:single', dependencies: ['enzywizard-clean:single'],
        parameters: [{tool: enzywizard-energy, side: single, parameter: minimize_energy, value: true, accepted_values: [true]}, {tool: enzywizard-energy, side: single, parameter: minimization_iteration,
            value: 100, accepted_values: [100]}], reuse_inputs: {}}
      plan1/enzywizard-flexibility:single: {kind: plan_call, after: [plan1, 'plan1/enzywizard-clean:single'], stage: 1, key: 'enzywizard-flexibility:single', dependencies: ['enzywizard-clean:single'],
        parameters: [{tool: enzywizard-flexibility, side: single, parameter: method, value: ANM, accepted_values: [ANM]}, {tool: enzywizard-flexibility, side: single, parameter: cutoff,
            value: 15.0, accepted_values: [15.0]}, {tool: enzywizard-flexibility, side: single, parameter: n_modes, value: 20, accepted_values: [20]}], reuse_inputs: {}}
      plan1/enzywizard-disorder:single: {kind: plan_call, after: [plan1, 'plan1/enzywizard-clean:single'], stage: 1, key: 'enzywizard-disorder:single', dependencies: ['enzywizard-clean:single'],
        parameters: [], reuse_inputs: {}}
      plan1/enzywizard-integrate:single: {kind: plan_call, after: [plan1, 'plan1/enzywizard-energy:single', 'plan1/enzywizard-flexibility:single', 'plan1/enzywizard-disorder:single'],
        stage: 1, key: 'enzywizard-integrate:single', dependencies: ['enzywizard-energy:single', 'enzywizard-flexibility:single', 'enzywizard-disorder:single'], parameters: [], reuse_inputs: {}}
      approval: {kind: approval, after: ['plan1/enzywizard-clean:single', 'plan1/enzywizard-energy:single', 'plan1/enzywizard-flexibility:single', 'plan1/enzywizard-disorder:single',
