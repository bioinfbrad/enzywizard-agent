      exclusive_execution_tools: []
      required_parameters: []
      required_historical_input: {tool: enzywizard-disorder, inputs: {input_path: cleaned_structure_cif}}
- case_id: T1-HR03
  description: "Summarize historical cholesterol oxidase energy and run pockets"
  enzyme_id: 1MXT
  request: "Summarize the energy report from turn 2, then run a new binding-pocket analysis."
  input_profile: 1mxt_single
  history:
    turn_id: 2
    operation: summarize
    artifacts:
    - artifact_type: energy_report_json
      side: single
      artifact_path: resources/history_fixtures/1MXT/energy/energy_report.json
    reuse_policy: none
  reference_answers:
  - {workflow: [pocket], answer: "Locate the requested report from turn 2 and use it for the historical part of the request. Run enzywizard-clean -> enzywizard-pocket ->
      enzywizard-integrate. Produce the required artifacts: cleaned_structure_cif (single), cleaned_structure_pdb (single), cleaned_sequence_fasta
      (single), clean_report_json (single), pocket_report_json (single), integrate_report_json (single), integrate_nodes_json (single),
      integrate_edges_json (single)."}
  expected_trajectories:
  - workflow:
    - pocket
    events:
    - "Record the routed request."
    - "Resolve the required historical source before planning."
    - "Record and approve the final plan: enzywizard-clean -> enzywizard-pocket -> enzywizard-integrate."
    - "Execute the final plan with the milestone dependencies respected."
    - "Record the produced files and terminal execution status."
  scoring:
  - profiles:
    - pocket
    milestones:
      request: {kind: routing, after: [], stage: 1, actions: [analyze_history, run_tool_workflow]}
      history: {kind: history, after: [request], turn: 2, operations: [summarize], accepted_artifact_types: [energy_report_json]}
      plan1: {kind: plan, after: [request, history], stage: 1, allowed: ['enzywizard-clean:single', 'enzywizard-pocket:single', 'enzywizard-integrate:single']}
      plan1/enzywizard-clean:single: {kind: plan_call, after: [plan1], stage: 1, key: 'enzywizard-clean:single', dependencies: [], parameters: [], reuse_inputs: {}}
      plan1/enzywizard-pocket:single: {kind: plan_call, after: [plan1, 'plan1/enzywizard-clean:single'], stage: 1, key: 'enzywizard-pocket:single', dependencies: ['enzywizard-clean:single'],
