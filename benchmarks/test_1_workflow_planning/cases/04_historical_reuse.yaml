      - []
      execution_call_limits: {'enzywizard-disorder:single': 1, 'enzywizard-integrate:single': 1}
      executed_revoked_plan: true
      wrong_historical_source: true
      wrong_historical_input: {tool: enzywizard-disorder, inputs: {input_path: cleaned_structure_cif}}
    success:
