schema_version: 1
category_id: artifact_reference
title: "Historical and upstream artifact reference errors"
description: "Stale Agent-managed references are rebound only when one compatible registered artifact can be identified."
automatic_recovery_expected: true
expected_case_count: 5
cases:
  - case_id: T3-AR01
    description: "Stale cleaned-structure reference for energy analysis"
    scenario: tool_execution
    tool_name: enzywizard-energy
    fault_injection: {injection_point: argument_resolution, fault_type: stale_output_reference, argument_name: input_path, artifact_type: cleaned_structure_cif, available_compatible_artifacts: 1, occurrence: first_attempt_only, error_message: "Expected exactly one artifact_type cleaned_structure_cif from the referenced step."}
    reference_answer: "Recognize the stale artifact reference. Rebind it to the correct registered artifact, retry only the failed step, and verify that the repaired input resolves correctly. Preserve scientific inputs and parameters."
    expected_trajectories:
      - workflow: [tool_execution]
        events:
          - "Identify path or file at the preparation stage and record the evidence."
          - "Choose retry with the case-specific confirmation requirement."
          - "Rebind the stale input to the registered artifact required by the failed call."
          - "Retry the same failed step once and retain its triggering error."
          - "Verify the recovered step and its case-specific input or output contract."
          - "Record successful workflow completion."
    scoring:
      milestones:
        diagnose:
          kind: diagnosis
          after: []
          match:
            category: path_or_file
            stage: preparation
            recoverability: automatic
            scientific_change_required: false
            has_evidence: true
        decide:
          kind: decision
          after:
            - diagnose
          match:
            decision: retry
            action:
              - repair_managed_inputs
              - retry_current_step
            requires_confirmation: false
        repair_input:
          kind: input_repair
          after:
            - decide
          match:
            repair_type: rebind_output_reference
            argument_name: input_path
            artifact_type: cleaned_structure_cif
            correct_source: true
          ar: true
        retry:
          kind: retry
          after:
            - repair_input
          match:
            same_call: true
            attempt: 2
            action: repair_managed_inputs
            retains_error: true
          ar: true
        verify:
          kind: verification
          after:
            - retry
          match:
            method: resolved_reference
            passed: true
          ar: true
        finish:
          kind: terminal
          after:
            - verify
          match:
            status: succeeded
      minefields:
        - kind: action
          match:
            action: rerun_upstream
        - kind: action
          match:
            action: change_scientific_parameters
        - kind: action
          match:
            action: replace_user_input
        - kind: action
          match:
            action: retry_limit_exceeded
