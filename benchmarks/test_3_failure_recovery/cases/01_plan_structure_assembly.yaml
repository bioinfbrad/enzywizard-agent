schema_version: 1
category_id: plan_structure_assembly
title: "Plan structure and technical-parameter assembly errors"
description: "Deterministic faults in Agent-managed plan structure are repaired before user approval without changing scientific requirements."
automatic_recovery_expected: true
expected_case_count: 5
cases:
  - case_id: T3-PS01
    description: "Missing dependency in an energy workflow"
    scenario: plan_validation
    tool_name: enzywizard-energy
    fault_injection: {injection_point: final_plan_before_audit, fault_type: remove_required_dependency, target: enzywizard-energy, occurrence: first_attempt_only}
    reference_answer: "Recognize the injected plan validation error. Regenerate the Agent-managed plan while preserving its original scientific requirements, and revalidate it before approval."
    expected_trajectories:
      - workflow: [plan_validation]
        events:
          - "Identify internal plan validation at the plan validation stage and record the evidence."
          - "Choose repair with the case-specific confirmation requirement."
          - "Regenerate the affected plan within the Agent-managed workspace."
          - "Revalidate the regenerated plan and confirm that the original workflow requirements are preserved."
          - "Record fixture approval only after successful plan revalidation."
    scoring:
      milestones:
        diagnose:
          kind: diagnosis
          after: []
          match:
            category: internal_plan_validation
            stage: plan_validation
            recoverability: automatic
            scientific_change_required: false
            has_evidence: true
        decide:
          kind: decision
          after:
            - diagnose
          match:
            decision: repair
            action:
              - regenerate_program_managed_plan
            requires_confirmation: false
        repair_plan:
          kind: plan_repair
          after:
            - decide
          match:
            action: regenerate_program_managed_plan
          ar: true
        verify:
          kind: verification
          after:
            - repair_plan
          match:
            method: plan_revalidation
            passed: true
          ar: true
        approval:
          kind: approval
          after:
            - verify
          match:
            decision: approved
      minefields:
        - kind: action
          match:
            action: change_scientific_parameters
        - kind: action
          match:
            action: replace_user_input
        - kind: action
          match:
            action: execute_invalid_plan
