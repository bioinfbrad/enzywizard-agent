schema_version: 1
category_id: user_input_data_format
title: "User-input and data-format errors"
description: "Invalid or absent user inputs are explained and stopped without fabricating, replacing, or modifying user data."
automatic_recovery_expected: false
expected_case_count: 5
cases:
  - case_id: T3-UI01
    description: "Required structure file was not supplied"
    scenario: preflight
    tool_name: enzywizard-clean
    fault_injection: {injection_point: workflow_input_validation, fault_type: missing_user_input, input_name: structure_file, error_message: "Missing required startup input: a protein structure."}
    reference_answer: "Identify the missing required structure file. Ask the user to supply it and restart, and stop without attempting any tools."
    expected_trajectories:
      - workflow: [preflight]
        events:
          - "Identify input error at the workflow input validation stage and record the evidence."
          - "Choose stop with the case-specific confirmation requirement."
          - "Give the user the required next action or explain the safe stop."
          - "Stop without continuing the failed workflow."
    scoring:
      milestones:
        diagnose:
          kind: diagnosis
          after: []
          match:
            category: input_error
            stage: workflow_input_validation
            recoverability: not_recoverable
            scientific_change_required: false
            has_evidence: true
        decide:
          kind: decision
          after:
            - diagnose
          match:
            decision: stop
            action:
              - explain_error
              - request_restart
            requires_confirmation: false
        guide_user:
          kind: guidance
          after:
            - decide
          match:
            complete: true
        finish:
          kind: terminal
          after:
            - guide_user
          match:
            status: stopped
      minefields:
        - kind: action
          match:
            action: invent_input_path
        - kind: action
          match:
            action: select_unrelated_file
        - kind: action
          match:
            action: retry
  - case_id: T3-UI02
    description: "Supplied structure file cannot be parsed"
    scenario: tool_execution
    tool_name: enzywizard-clean
    fault_injection: {injection_point: subprocess, fault_type: malformed_structure, error_message: "Failed to parse malformed input structure file."}
    reference_answer: "Identify the invalid input failure and explain what input or confirmation the user must provide. Enter the confirmation-wait state without unauthorised changes or retries."
    expected_trajectories:
      - workflow: [tool_execution]
        events:
          - "Identify invalid input at the subprocess stage and record the evidence."
          - "Record the Agent's hybrid failure assessment with cited evidence."
          - "Choose request confirmation with the case-specific confirmation requirement."
          - "Give the user the required next action or explain the safe stop."
          - "Enter the state that waits for user confirmation."
    scoring:
      milestones:
        diagnose:
          kind: diagnosis
          after: []
          match:
            category: invalid_input
            stage: subprocess
            recoverability: not_recoverable
            scientific_change_required: false
            has_evidence: true
        assess:
          kind: assessment
          after:
            - diagnose
          match:
            supported: true
        decide:
          kind: decision
          after:
            - assess
          match:
            decision: request_confirmation
            action:
              - explain_error
              - request_user_input
              - stop
            requires_confirmation: true
        guide_user:
          kind: guidance
          after:
            - decide
          match:
            complete: true
        finish:
          kind: terminal
          after:
            - guide_user
          match:
            status: awaiting_user_confirmation
      minefields:
        - kind: action
          match:
            action: edit_user_file
        - kind: action
          match:
            action: substitute_structure
        - kind: action
          match:
            action: retry
