- term: angstrom
  aliases: []
  uri: http://qudt.org/vocab/unit/ANGSTROM
  description: The \(Angstr\ddot{o}m\) is an internationally recognized unit of length equal to \(0.1
    \,nanometre\) or \(1 \times 10^{-10}\,metres\). Although accepted for use, it is not formally defined
    within the International System of Units(SI). The angstrom is often used in the natural sciences to
    express the sizes of atoms, lengths of chemical bonds and the wavelengths of electromagnetic radiation,
    and in technology for the dimensions of parts of integrated circuits. It is also commonly used in
    structural biology.
  source_documents:
