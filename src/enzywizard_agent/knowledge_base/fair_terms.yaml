    used for indicating mass on an atomic or molecular scale. It is defined as one twelfth of the rest
    mass of an unbound atom of carbon-12 in its nuclear and electronic ground state, and has a value of
    \(1.660538782(83) \times 10^{-27} kg\). One \(Da\) is approximately equal to the mass of one proton
