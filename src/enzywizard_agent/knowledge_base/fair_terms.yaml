  description: Information content is a fundamental concept in information theory that quantifies the
    amount of information contained within a message. It serves as a pivotal measure in communication
    engineering, akin to physical quantities such as mass or energy in other sciences. The broad interpretation
    of "information" encompasses diverse forms, including text, visual data, signals in communication,
    and the outcomes of random events. The theory originated from the need to understand how messages
