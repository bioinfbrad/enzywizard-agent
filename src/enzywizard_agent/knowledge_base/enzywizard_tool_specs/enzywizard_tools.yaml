        cli_flags: ["--hbond_da_max_distance"]
        python_type: float
        default: 3.9
        description: Maximum donor-acceptor distance for hydrogen bond detection.
      - name: hbond_ha_max_distance
        cli_flags: ["--hbond_ha_max_distance"]
        python_type: float
        default: 2.5
        description: Maximum hydrogen-acceptor distance for hydrogen bond detection.
      - name: hbond_angle
        cli_flags: ["--hbond_angle"]
        python_type: float
        default: 90.0
        description: Minimum donor-hydrogen-acceptor angle for hydrogen bond detection.
      - name: ionic_distance_cutoff
        cli_flags: ["--ionic_distance_cutoff"]
        python_type: float
        default: 4.0
        description: Maximum distance for ionic interaction detection.
      - name: vdw_mu
        cli_flags: ["--vdw_mu"]
        python_type: float
        default: 0.01
        description: Mu parameter used for van der Waals interaction detection.
      - name: ppstack_center_distance_cutoff
        cli_flags: ["--ppstack_center_distance_cutoff"]
        python_type: float
        default: 6.5
        description: Maximum ring-center distance for pi-pi stacking detection.
      - name: pication_distance_cutoff
        cli_flags: ["--pication_distance_cutoff"]
        python_type: float
        default: 5.0
        description: Maximum ring-cation distance for pi-cation interaction detection.
      - name: pication_angle_cutoff
        cli_flags: ["--pication_angle_cutoff"]
        python_type: float
        default: 45.0
        description: Maximum angle for pi-cation interaction detection.
      - name: ssbond_max_distance
        cli_flags: ["--ssbond_max_distance"]
        python_type: float
        default: 2.5
        description: Maximum sulfur-sulfur distance for disulfide bond detection.
    argument_rules:
      - cleaned_input_path must already be cleaned.
      - If input_msa is omitted, conservation and HMM outputs are skipped.
      - If substrate_names is omitted, substrate, docking, and protein-substrate interaction steps are skipped.
      - dock_box_size is required when dock_catalytic_residue or dock_catalytic_site_coord is provided.
    output_files:
      - artifact_type: integrate_report_json
        filename_pattern: integrate_report_{protein_name}.json
        pattern_description: "{protein_name} is derived from the cleaned input structure file stem."
        description: Final integrated single-protein graph report.
      - artifact_type: integrate_nodes_json
        filename_pattern: integrate_nodes_{protein_name}.json
        pattern_description: "{protein_name} is derived from the cleaned input structure file stem."
        description: Node-only JSON graph output.
      - artifact_type: integrate_edges_json
        filename_pattern: integrate_edges_{protein_name}.json
        pattern_description: "{protein_name} is derived from the cleaned input structure file stem."
        description: Edge-only JSON graph output.
      - artifact_type: optional_intermediate_outputs
        filename_pattern: multiple batch side-report and intermediate files
        pattern_description: Written only when --save_extra_outputs is enabled or during internal workflow execution.
        description: Cleaned MSA, HMM, substrate SDF, docking, interaction, and side-report outputs.
      - artifact_type: log_file
        filename_pattern: log.txt
        pattern_description: Fixed log filename in the output directory.
        description: Processing log.
    output_metadata:
      - name: integrated_graph
        source_file: integrate_report_json
        description: Final graph dataset for single-protein analysis.
    planning_rules:
      - For broad single-protein analysis, prefer clean followed by batch over manually scheduling all side tools.
      - If no suitable cleaned single-protein structure is available, schedule enzywizard-clean before this tool.
      - Pass an MSA only when a corresponding MSA input is available.
      - Pass a substrate only when a substrate name or SMILES is available.
    additional_notes:
      - This is the preferred standard orchestrator for complete single-protein workflows.

  enzywizard-mut-batch:
    display_name: EnzyWizard-Mut-Batch
    command_name: enzywizard-mut-batch
    allowed_in_purpose_types:
      - wildtype_mutant_comparison
    description: >
      Runs the standard paired WT/MUT EnzyWizard workflow on cleaned WT and MUT
      structures. It performs side analyses on both proteins, optionally uses
      WT/MUT MSA inputs, optionally runs substrate/docking/interaction workflows
      on both sides, and writes mutation-integrated graph outputs.
    capabilities:
      - Run paired WT and MUT integrated analyses.
      - Compare matched side reports through mutation integration.
      - Use cleaned_amino_acid_substitution from mut-clean as the mutation anchor.
      - Skip conservation when side MSA inputs are absent.
      - Fall back to paired protein-only output when substrate or docking fails.
    use_when:
      - The user requests a broad WT/MUT comparison.
      - The agent should run the standard complete paired workflow.
      - The user requests a complete WT/MUT graph comparison.
    do_not_use_when:
      - The request is a single-protein analysis.
      - cleaned_amino_acid_substitution is unknown and no mut-clean step is planned.
      - The user explicitly names specific paired analysis types rather than requesting a complete or broad workflow; use the corresponding standalone tools and let the program add enzywizard-mut-integrate.
    input_file_requirements:
      - Requires cleaned WT and MUT CIF or PDB structures.
      - Requires cleaned_amino_acid_substitution from mut-clean.
      - Optional WT and MUT MSA files enable side conservation analyses.
      - Optional substrate name or SMILES enables paired substrate, docking, and interaction analyses.
    upstream_tools:
      - enzywizard-mut-clean
    downstream_tools: []
    required_arguments:
      - name: wt_cleaned_input_path
        cli_flags: ["-w", "--wt_cleaned_input_path"]
        python_type: str
        value_type: path
        description: Cleaned wild-type CIF or PDB structure.
      - name: mut_cleaned_input_path
        cli_flags: ["-m", "--mut_cleaned_input_path"]
        python_type: str
        value_type: path
        description: Cleaned mutant CIF or PDB structure.
      - name: cleaned_amino_acid_substitution
        cli_flags: ["-a", "--cleaned_amino_acid_substitution"]
        python_type: str
        value_type: amino_acid_substitution
        description: Cleaned residue-numbering mutation string from mut-clean.
      - name: wt_output_dir
        cli_flags: ["-wo", "--wt_output_dir"]
        python_type: str
        value_type: directory
        description: Wild-type output directory.
      - name: mut_output_dir
        cli_flags: ["-mo", "--mut_output_dir"]
        python_type: str
        value_type: directory
        description: Mutant output directory.
    optional_arguments:
      - name: wt_input_msa
        cli_flags: ["-wm", "--wt_input_msa"]
        python_type: str
        default: null
        description: Optional WT MSA file.
      - name: mut_input_msa
        cli_flags: ["-mm", "--mut_input_msa"]
        python_type: str
        default: null
        description: Optional MUT MSA file.
      - name: substrate_names
        cli_flags: ["-s", "--substrate_names"]
        python_type: str
        default: null
        description: Optional substrate name or SMILES applied to both WT and MUT sides.
      - name: save_extra_outputs
        cli_flags: ["--save_extra_outputs"]
        cli_action: store_true
        python_type: bool
        default: false
        description: Keep side reports and intermediate files.
      - name: hydrocluster_cutoff
        cli_flags: ["--hydrocluster_cutoff"]
        python_type: float
        default: 10.0
        description: Hydrophobic cluster contact area cutoff applied to both WT and MUT.
      - name: minimize_energy
        cli_flags: ["--no_minimize_energy"]
        cli_action: store_false
        python_type: bool
        default: true
        description: Energy minimization is enabled on both sides by default; the CLI flag disables it.
      - name: energy_minimization_iteration
        cli_flags: ["--energy_minimization_iteration"]
        python_type: int
        default: 100
        description: Maximum energy minimization iterations applied to each side.
      - name: flexibility_method
        cli_flags: ["--flexibility_method"]
        python_type: str
        default: ANM
        allowed_values: ["ANM", "GNM"]
        description: Flexibility method applied to both WT and MUT.
      - name: flexibility_cutoff
        cli_flags: ["--flexibility_cutoff"]
        python_type: float
        default: 15.0
        description: Flexibility residue connection cutoff applied to both sides.
      - name: flexibility_n_modes
        cli_flags: ["--flexibility_n_modes"]
        python_type: int
        default: 20
        description: Number of flexibility modes calculated for each side.
      - name: disorder_window_size
        cli_flags: ["--disorder_window_size"]
        python_type: int
        default: 11
        description: Disorder sliding window size applied to both sides.
      - name: disorder_min_region_length
        cli_flags: ["--disorder_min_region_length"]
        python_type: int
        default: 5
        description: Minimum disordered region length applied to both sides.
      - name: embedding_model_name
        cli_flags: ["--embedding_model_name"]
        python_type: str
        default: esm2_t6_8M_UR50D
        allowed_values: ["esm2_t6_8M_UR50D", "esm2_t12_35M_UR50D", "esm2_t30_150M_UR50D"]
        description: ESM2 embedding model used for both sides.
      - name: pocket_min_rad
        cli_flags: ["--pocket_min_rad"]
        python_type: float
        default: 1.8
        description: Minimum pocket probe radius applied to both sides.
      - name: pocket_max_rad
        cli_flags: ["--pocket_max_rad"]
        python_type: float
        default: 6.2
        description: Maximum pocket probe radius applied to both sides.
      - name: pocket_min_volume
        cli_flags: ["--pocket_min_volume"]
        python_type: int
        default: 50
        description: Minimum pocket volume applied to both sides.
      - name: substrate_max_synonyms
        cli_flags: ["--substrate_max_synonyms"]
        python_type: int
        default: 20
        description: Maximum substrate synonyms retried during name resolution.
      - name: substrate_fp_radius
        cli_flags: ["--substrate_fp_radius"]
        python_type: int
        default: 2
        description: Morgan fingerprint radius used for the shared substrate.
      - name: substrate_n_bits
        cli_flags: ["--substrate_n_bits"]
        python_type: int
        default: 512
        description: Morgan fingerprint bit length used for the shared substrate.
      - name: substrate_num_confs
        cli_flags: ["--substrate_num_confs"]
        python_type: int
        default: 5
        description: Maximum substrate conformers generated for paired docking.
      - name: substrate_prune_rms
        cli_flags: ["--substrate_prune_rms"]
        python_type: float
        default: 0.5
        description: Conformer pruning RMS threshold for the shared substrate.
      - name: dock_max_attempt_num
        cli_flags: ["--dock_max_attempt_num"]
        python_type: int
        default: 20
        description: Maximum docking attempts on each side.
      - name: dock_early_stop
        cli_flags: ["--dock_no_early_stop"]
        cli_action: store_false
        python_type: bool
        default: true
        description: Stop after the first successful docking result on each side by default.
      - name: dock_exhaustiveness
        cli_flags: ["--dock_exhaustiveness"]
        python_type: int
        default: 8
        description: Vina search exhaustiveness applied to both sides.
      - name: dock_cpu
        cli_flags: ["--dock_cpu"]
        python_type: int
        default: 0
        description: Vina CPU count used for paired docking.
      - name: dock_catalytic_residue
        cli_flags: ["--dock_catalytic_residue"]
        python_type: int
        default: null
        description: Cleaned residue index used as the docking center on both sides; requires dock_box_size.
      - name: dock_catalytic_site_coord
        cli_flags: ["--dock_catalytic_site_coord"]
        python_type: str
        default: null
        description: Manual docking center x,y,z applied to both sides; requires dock_box_size.
      - name: dock_box_size
        cli_flags: ["--dock_box_size"]
        python_type: str
        default: null
        description: Docking box size x,y,z required for a manual docking center.
      - name: hbond_bonded_h_min_distance
        cli_flags: ["--hbond_bonded_h_min_distance"]
        python_type: float
        default: 0.8
        description: Minimum bonded heavy atom-hydrogen distance used on both sides.
      - name: hbond_bonded_h_max_distance
        cli_flags: ["--hbond_bonded_h_max_distance"]
        python_type: float
        default: 1.3
        description: Maximum bonded heavy atom-hydrogen distance used on both sides.
      - name: hbond_da_max_distance
        cli_flags: ["--hbond_da_max_distance"]
        python_type: float
        default: 3.9
        description: Maximum donor-acceptor distance for hydrogen bond detection.
      - name: hbond_ha_max_distance
        cli_flags: ["--hbond_ha_max_distance"]
        python_type: float
        default: 2.5
        description: Maximum hydrogen-acceptor distance for hydrogen bond detection.
      - name: hbond_angle
        cli_flags: ["--hbond_angle"]
        python_type: float
        default: 90.0
        description: Minimum donor-hydrogen-acceptor angle for hydrogen bond detection.
      - name: ionic_distance_cutoff
        cli_flags: ["--ionic_distance_cutoff"]
        python_type: float
        default: 4.0
        description: Maximum distance for ionic interaction detection.
      - name: vdw_mu
        cli_flags: ["--vdw_mu"]
        python_type: float
        default: 0.01
        description: Mu parameter used for van der Waals interaction detection.
      - name: ppstack_center_distance_cutoff
        cli_flags: ["--ppstack_center_distance_cutoff"]
        python_type: float
        default: 6.5
        description: Maximum ring-center distance for pi-pi stacking detection.
      - name: pication_distance_cutoff
        cli_flags: ["--pication_distance_cutoff"]
        python_type: float
        default: 5.0
        description: Maximum ring-cation distance for pi-cation interaction detection.
      - name: pication_angle_cutoff
        cli_flags: ["--pication_angle_cutoff"]
        python_type: float
        default: 45.0
        description: Maximum angle for pi-cation interaction detection.
      - name: ssbond_max_distance
        cli_flags: ["--ssbond_max_distance"]
        python_type: float
        default: 2.5
        description: Maximum sulfur-sulfur distance for disulfide bond detection.
    argument_rules:
      - wt_output_dir and mut_output_dir must be different.
      - cleaned_amino_acid_substitution must come from the mut-clean report.
      - If WT or MUT MSA is omitted, conservation for that side is skipped.
      - If substrate_names is omitted, paired substrate, docking, and protein-substrate interactions are skipped.
    output_files:
      - artifact_type: mut_integrate_report_json
        filename_pattern: mut_integrate_report_{wt_protein_name}_to_{mut_protein_name}.json
        pattern_description: "{wt_protein_name} and {mut_protein_name} are derived from cleaned WT and MUT structure stems."
        description: Final paired WT/MUT integrated graph report.
      - artifact_type: wt_integrate_nodes_json
        filename_pattern: wt_integrate_nodes_{wt_protein_name}.json
        pattern_description: "{wt_protein_name} is derived from the cleaned WT structure stem."
        description: WT node-only graph JSON.
      - artifact_type: wt_integrate_edges_json
        filename_pattern: wt_integrate_edges_{wt_protein_name}.json
        pattern_description: "{wt_protein_name} is derived from the cleaned WT structure stem."
        description: WT edge-only graph JSON.
      - artifact_type: mut_integrate_nodes_json
        filename_pattern: mut_integrate_nodes_{mut_protein_name}.json
        pattern_description: "{mut_protein_name} is derived from the cleaned MUT structure stem."
        description: MUT node-only graph JSON.
      - artifact_type: mut_integrate_edges_json
        filename_pattern: mut_integrate_edges_{mut_protein_name}.json
        pattern_description: "{mut_protein_name} is derived from the cleaned MUT structure stem."
        description: MUT edge-only graph JSON.
      - artifact_type: optional_intermediate_outputs
        filename_pattern: multiple paired side-report and intermediate files
        pattern_description: Written when --save_extra_outputs is enabled or during internal workflow execution.
        description: WT/MUT side reports, cleaned MSA, HMM, substrate SDF, docking, and interaction outputs.
      - artifact_type: log_file
        filename_pattern: log.txt
        pattern_description: Fixed log filename in the WT output directory.
        description: Processing log.
    output_metadata:
      - name: wild_type_integrated_graph
        source_file: mut_integrate_report_json
        description: Integrated WT graph data.
      - name: mutant_integrated_graph
        source_file: mut_integrate_report_json
        description: Integrated MUT graph data.
    planning_rules:
      - For broad WT/MUT comparison, prefer mut-clean followed by mut-batch.
      - If paired cleaned structures or the cleaned mutation are unavailable, schedule enzywizard-mut-clean before this tool.
      - Pass the same substrate name or SMILES to both sides when a substrate input is available.
    additional_notes:
      - This is the preferred standard orchestrator for complete WT/MUT comparison workflows.

  enzywizard-mut-integrate:
    display_name: EnzyWizard-Mut-Integrate
    command_name: enzywizard-mut-integrate
    allowed_in_purpose_types:
      - wildtype_mutant_comparison
    description: >
      Integrates matched wild-type and mutant EnzyWizard side reports into
      paired graph outputs. The mut-clean report provides the mutation anchor,
      residue mapping, and cleaned amino acid substitution.
    capabilities:
      - Merge WT and MUT side report directories.
      - Generate paired integrated graph reports and side-specific node/edge JSON files.
      - Support non-strict partial integration or strict complete report integration.
    use_when:
      - The program has selected one or more standalone paired analysis tools whose WT and MUT reports must be combined into paired graph outputs.
    do_not_use_when:
      - enzywizard-mut-batch is selected and already performs mutation integration.
      - The user requests a complete paired graph or broad comparison; use enzywizard-mut-batch instead.
      - No mut-clean report is available and no mut-clean step is planned.
    input_file_requirements:
      - Requires a mut-clean report JSON file.
      - Requires a WT report directory and a MUT report directory.
    upstream_tools:
      - enzywizard-mut-clean
      - enzywizard-aaprops
      - enzywizard-hydrocluster
      - enzywizard-energy
      - enzywizard-flexibility
      - enzywizard-disorder
      - enzywizard-conservation
      - enzywizard-embedding
      - enzywizard-pocket
      - enzywizard-substrate
      - enzywizard-dock
      - enzywizard-interaction
    downstream_tools: []
    required_arguments:
      - name: mut_clean_report_path
        cli_flags: ["-i", "--mut_clean_report_path"]
        python_type: str
        value_type: path
        description: Required mut-clean report JSON file.
      - name: wt_input_dir
        cli_flags: ["-w", "--wt_input_dir"]
        python_type: str
        value_type: directory
        description: Directory containing WT side JSON reports.
      - name: mut_input_dir
        cli_flags: ["-m", "--mut_input_dir"]
        python_type: str
        value_type: directory
        description: Directory containing MUT side JSON reports.
      - name: wt_output_dir
        cli_flags: ["-wo", "--wt_output_dir"]
        python_type: str
        value_type: directory
        description: Directory for WT mutation-integrated outputs.
      - name: mut_output_dir
        cli_flags: ["-mo", "--mut_output_dir"]
        python_type: str
        value_type: directory
        description: Directory for MUT mutation-integrated outputs.
    optional_arguments:
      - name: strict
        cli_flags: ["--strict"]
        cli_action: store_true
        python_type: bool
        default: false
        description: Require all supported side report types and node fields.
    argument_rules:
      - wt_output_dir and mut_output_dir must be different directories.
      - mut_clean_report_path must point to an enzywizard_mut_clean report.
      - The mut-clean report should not be included inside wt_input_dir or mut_input_dir as a side report.
    output_files:
      - artifact_type: mut_integrate_report_json
        filename_pattern: mut_integrate_report_{wt_protein_name}_to_{mut_protein_name}.json
        pattern_description: Protein names are derived from the mut-clean report file name and content.
        description: Full paired WT/MUT integrated graph report.
      - artifact_type: wt_integrate_nodes_json
        filename_pattern: wt_integrate_nodes_{wt_protein_name}.json
        pattern_description: WT protein name is derived from the mut-clean report.
        description: WT node-only JSON.
      - artifact_type: wt_integrate_edges_json
        filename_pattern: wt_integrate_edges_{wt_protein_name}.json
        pattern_description: WT protein name is derived from the mut-clean report.
        description: WT edge-only JSON.
      - artifact_type: mut_integrate_nodes_json
        filename_pattern: mut_integrate_nodes_{mut_protein_name}.json
        pattern_description: MUT protein name is derived from the mut-clean report.
        description: MUT node-only JSON.
      - artifact_type: mut_integrate_edges_json
        filename_pattern: mut_integrate_edges_{mut_protein_name}.json
        pattern_description: MUT protein name is derived from the mut-clean report.
        description: MUT edge-only JSON.
      - artifact_type: log_file
        filename_pattern: log.txt
        pattern_description: Fixed log filename in the WT output directory.
        description: Processing log.
    output_metadata:
      - name: paired_integrated_graphs
        source_file: mut_integrate_report_json
        description: WT and MUT integrated graph data plus mutation mapping.
    planning_rules:
      - EnzyWizard-Agent adds mut-integrate programmatically after any one or more standalone WT/MUT analysis tools are selected.
      - The mut-batch rule takes priority; never select enzywizard-mut-integrate together with enzywizard-mut-batch.
    additional_notes:
      - Mut-integrate synthesizes clean information from the mut-clean report; separate enzywizard-clean reports are not required for the paired integration anchor.
